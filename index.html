}
function syncPointInputs(i){ const card=document.querySelector(`#points .card[data-post-idx="${i}"]`); if(!card) return; const p=S.points[i]; if(!p) return;
  const rx=card.querySelector('.rx'),rxn=card.querySelector('.rxn'),ry=card.querySelector('.ry'),ryn=card.querySelector('.ryn');
  if(rx){ rx.value=p.x.toFixed(1); rxn.value=fmt(p.x); } if(ry){ ry.value=p.y.toFixed(1); ryn.value=fmt(p.y); } }

function addPost(){
  const {w,d}=S.garden;
  S.points.push({x:0, y:0, h:2.4, shackle:HARDWARE.shackles[0], turnbuckle:findHardware('turnbuckles','Jaw & Jaw 6mm')});
  buildPointEditors(); buildSailEditors(); buildPoles(); buildLabels(); buildDimensions(); updateAll(); touch();
}
function removePost(i){
  if(i<0||i>=S.points.length) return;
  if(S.points.length<=1){ showToast('At least one post is required.'); return; }
  S.points.splice(i,1);
  S.sails.forEach(s=>{
    s.posts=s.posts.map(pi=> pi===i ? -1 : pi>i ? pi-1 : pi);
    const used=new Set();
    s.posts=s.posts.map(pi=>{
      if(pi>=0&&pi<S.points.length&&!used.has(pi)){ used.add(pi); return pi; }
      for(let k=0;k<S.points.length;k++) if(!used.has(k)){ used.add(k); return k; }
      return 0;
    });
  });
  buildPointEditors(); buildSailEditors(); buildPoles(); buildLabels(); buildDimensions(); updateAll(); touch();
}

function postOptions(selected){ return S.points.map((p,i)=>`<option value="${i}" style="color:${postColor(i)}" ${i===selected?'selected':''}>● ${t('post-label')} ${i+1}</option>`).join(''); }
function nextFreePost(s){ for(let i=0;i<S.points.length;i++) if(!s.posts.includes(i)) return i; return 0; }
function newSailDefaults(){
  const shape=3;
  const posts=[]; while(posts.length<shape) posts.push(nextFreePost({posts}));
  return { shape, posts, a:3.5, b:3.5, c:3.5, bw:3.5, bl:3.5, color:'#d4a017', opacity:0.7, rot:0, dx:0, dz:0, on:true, tension:0.05 };
}
function addSail(){
  S.sails.push(newSailDefaults());
  buildSailEditors(); updateAll(); touch();
}
function removeSail(i){
  if(i<0||i>=S.sails.length) return;
  S.sails.splice(i,1);
  buildSailEditors(); updateAll(); touch();
}
function rotateSail(s,dir){ if(dir>0) s.posts.unshift(s.posts.pop()); else s.posts.push(s.posts.shift()); }
function shiftSailGroup(si,opts){
  const s=S.sails[si]; if(!s || s.shape!=='custom') return;
  const idxs=s.posts.filter(i=>i>=0 && i<S.points.length);
  if(idxs.length===0) return;
  const ps=idxs.map(i=>S.points[i]);
  if(opts.x||opts.y){ const dx=opts.x||0, dy=opts.y||0; ps.forEach(p=>{ p.x+=dx; p.y+=dy; }); }
  if(opts.rot){
    const cx=ps.reduce((a,p)=>a+p.x,0)/ps.length;
    const cy=ps.reduce((a,p)=>a+p.y,0)/ps.length;
    const rad=opts.rot*Math.PI/180; const ca=Math.cos(rad), sa=Math.sin(rad);
    ps.forEach(p=>{ const dx=p.x-cx, dy=p.y-cy; p.x=cx+dx*ca-dy*sa; p.y=cy+dx*sa+dy*ca; });
  }
  buildPointEditors(); updateAll(); touch();
}
function buildSailEditors(){
  const host=$('sails'); host.innerHTML='';
  S.sails.forEach((s,si)=>{
    const card=document.createElement('div'); card.className='card'; card.dataset.sailIdx=si;
    if(s.shape==='custom'){
      const n=(s.vertices||[]).length;
      card.innerHTML=`<h3><span>${t('sail-label')} ${si+1} (custom ${n}-point)</span><label style="font-weight:400;font-size:11px;color:var(--muted)"><input type="checkbox" class="on" ${s.on?'checked':''}> ${t('lbl-active')}</label><button class="minib remove-sail" data-idx="${si}">${t('btn-remove-sail')}</button></h3>
        <p class="hint">Measured polygon from Measure tab.</p>
        ${rowHTML(t('lbl-sail-rot'),'srot',-180,180,1,s.rot||0,'°',0)}
        <div class="row"><label>${t('lbl-color')}</label><input class="scol" type="color" value="${s.color}"></div>
        ${rowHTML(t('lbl-opacity'),'so',0.3,1,0.05,s.opacity,'',1)}
        ${numRowHTML('Center X','sx',s.dx||0,'m')}${numRowHTML('Center Z','sz',s.dz||0,'m')}
        <p class="hint" style="margin-top:4px">Move sail + attached poles as a group:</p>
        ${numRowHTML('Shift X','shiftX',0,'m')}${numRowHTML('Shift Y','shiftY',0,'m')}${numRowHTML('Rotate group','shiftR',0,'°')}`;
      const q=sel=>card.querySelector(sel);
      const rm=q('.remove-sail'); if(rm) rm.onclick=()=>removeSail(si);
      q('.on').onchange=e=>{ s.on=e.target.checked; updateAll(); touch(); };
      link(card,'srot',-180,180,v=>{s.rot=v;updateAll();});
      q('.scol').oninput=e=>{ s.color=e.target.value; buildSails(); touch(); };
      link(card,'so',0.3,1,v=>{s.opacity=v;buildSails();});
      bindNum(card,'sx',-50,50,v=>{s.dx=v;updateAll();});
      bindNum(card,'sz',-50,50,v=>{s.dz=v;updateAll();});
      bindNum(card,'shiftX',-50,50,v=>{ if(v!==0){ shiftSailGroup(si,{x:v}); } q('.shiftX').value='0'; });
      bindNum(card,'shiftY',-50,50,v=>{ if(v!==0){ shiftSailGroup(si,{y:v}); } q('.shiftY').value='0'; });
      bindNum(card,'shiftR',-180,180,v=>{ if(v!==0){ shiftSailGroup(si,{rot:v}); } q('.shiftR').value='0'; });
      host.appendChild(card); return;
    }
    const sizeHtml = s.shape===3
      ? numRowHTML(t('lbl-side-a'),'sa',s.a,'m')+numRowHTML(t('lbl-side-b'),'sb',s.b,'m')+numRowHTML(t('lbl-side-c'),'sc',s.c,'m')
      : numRowHTML(t('lbl-bw'),'bw',s.bw,'m')+numRowHTML(t('lbl-bl'),'bl',s.bl,'m');
    const tensionHtml = numRowHTML(t('lbl-tension'),'st',(s.tension!==undefined?s.tension:0.05)*100,'cm');
    let cornersHtml=''; for(let k=0;k<s.shape;k++) cornersHtml+=`<div class="row"><label>${t('lbl-corner-n')} ${k+1}</label><select class="ps" data-k="${k}">${postOptions(s.posts[k])}</select><span class="val rl" data-si="${si}" data-k="${k}">– m</span></div>`;
    card.innerHTML=`<h3><span>${t('sail-label')} ${si+1}</span><label style="font-weight:400;font-size:11px;color:var(--muted)"><input type="checkbox" class="on" ${s.on?'checked':''}> ${t('lbl-active')}</label><button class="minib remove-sail" data-idx="${si}">${t('btn-remove-sail')}</button></h3>
      <div class="seg"><button data-n="3" class="${s.shape===3?'active':''}">${t('lbl-3corners')}</button><button data-n="4" class="${s.shape===4?'active':''}">${t('lbl-4corners')}</button></div>
      ${sizeHtml}${tensionHtml}${cornersHtml}
      <div class="row"><label>${t('lbl-rotate')}</label><button class="minib rotL" title="${t('rot-ccw')}">⟲</button><button class="minib rotR" title="${t('rot-cw')}">⟳</button><button class="minib ctr" title="${t('center-tip')}">${t('lbl-center')}</button></div>
      ${rowHTML(t('lbl-sail-rot'),'srot',-180,180,1,s.rot||0,'°',0)}
      <div class="row"><label>${t('lbl-color')}</label><input class="scol" type="color" value="${s.color}"></div>
      ${rowHTML(t('lbl-opacity'),'so',0.3,1,0.05,s.opacity,'',1)}
      <p class="hint" style="margin:6px 0 0">${t('hint-sail-note')}</p>`;
    const q=sel=>card.querySelector(sel);
    const rm=q('.remove-sail'); if(rm) rm.onclick=()=>removeSail(si);
    q('.on').onchange=e=>{ s.on=e.target.checked; updateAll(); touch(); };
    card.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ const n=+b.dataset.n; if(n===s.shape) return;
      s.shape=n; s.posts=s.posts.slice(0,n); while(s.posts.length<n) s.posts.push(nextFreePost(s)); buildSailEditors(); updateAll(); touch(); });
    if(s.shape===3){ bindNum(card,'sa',0.5,20,v=>s.a=v); bindNum(card,'sb',0.5,20,v=>s.b=v); bindNum(card,'sc',0.5,20,v=>s.c=v); }
    else { bindNum(card,'bw',0.5,20,v=>s.bw=v); bindNum(card,'bl',0.5,20,v=>s.bl=v); }
    bindNum(card,'st',0,50,v=>{s.tension=v/100;updateAll();});
    card.querySelectorAll('.ps').forEach(sel=>sel.onchange=e=>{ s.posts[+sel.dataset.k]=+e.target.value; updateAll(); touch(); });
    q('.rotL').onclick=()=>{ rotateSail(s,-1); buildSailEditors(); updateAll(); touch(); };
    q('.rotR').onclick=()=>{ rotateSail(s, 1); buildSailEditors(); updateAll(); touch(); };
    q('.ctr').onclick=()=>{ s.dx=0; s.dz=0; s.rot=0; const sr=card.querySelector('.srot'),srn=card.querySelector('.srotn'); if(sr){sr.value=0;srn.value='0';} updateAll(); touch(); };
    link(card,'srot',-180,180,v=>{s.rot=v;updateAll();});
    q('.scol').oninput=e=>{ s.color=e.target.value; buildSails(); touch(); };
    link(card,'so',0.3,1,v=>{s.opacity=v;buildSails();});
    host.appendChild(card);
  });
  const addWrap=document.createElement('div'); addWrap.style.marginTop='8px';
  addWrap.innerHTML=`<button class="btn secondary" id="btnAddSail" style="width:100%">${t('btn-add-sail')}</button>`;
  addWrap.querySelector('#btnAddSail').onclick=addSail;
  host.appendChild(addWrap);
}

function circleIntersection(p0,r0,p1,r1){
  const dx=p1.x-p0.x, dz=p1.z-p0.z; const d=Math.hypot(dx,dz);
  if(d===0 || d>r0+r1+1e-9 || d<Math.abs(r0-r1)-1e-9) return [];
  const a=(r0*r0-r1*r1+d*d)/(2*d); const h2=Math.max(0,r0*r0-a*a); const h=Math.sqrt(h2);
  const xm=p0.x+a*dx/d, zm=p0.z+a*dz/d;
  const rx=-dz*h/d, rz=dx*h/d;
  return [{x:xm+rx,z:zm+rz},{x:xm-rx,z:zm-rz}];
}
function vSub(a,b){ return {x:a.x-b.x,z:a.z-b.z}; }
function vLen(v){ return Math.hypot(v.x,v.z); }
function vDot(a,b){ return a.x*b.x+a.z*b.z; }
function interiorAngle(prev,cur,next){
  const v1=vSub(prev,cur), v2=vSub(next,cur); const l1=vLen(v1), l2=vLen(v2);
  if(l1*l2<1e-12) return 0; return Math.acos(Math.max(-1,Math.min(1,vDot(v1,v2)/(l1*l2))));
}
function polygonArea(poly){
  let a=0; const n=poly.length; for(let i=0;i<n;i++){ const j=(i+1)%n; a+=poly[i].x*poly[j].z-poly[j].x*poly[i].z; } return Math.abs(a)/2;
}
function reconstructMeasuredPolygon(measure){
  const n=measure.n, sides=measure.sides.map(v=>+v||0), diagonals=measure.diagonals;
  const keys=measureSideKeys(n);
  const dkeys=measureDiagonalKeys(n);
  const pts=[]; let valid=true, error='';
  const side=(i)=>(sides[i]||0)/1000;
  const diag=(a,b)=>{ const k=pointLetter(a)+'-'+pointLetter(b); return (diagonals[k]||0)/1000; };
  pts.push({x:0,z:0}); pts.push({x:side(0),z:0});
  for(let i=2;i<n;i++){
    const r1=side(i-1); let r2=diag(0,i); if(r2<=0 && i===n-1) r2=side(n-1);
    if(r1<=0 || r2<=0){ valid=false; error='Missing length for point '+pointLetter(i); break; }
    const cands=circleIntersection(pts[i-1],r1,pts[0],r2);
    if(cands.length===0){ valid=false; error='Cannot locate point '+pointLetter(i); break; }
    let best=cands[0]; let bestScore=Infinity;
    for(const c of cands){
      let score=0; let cnt=0;
      for(let j=1;j<i-1;j++){ const d=diag(j,i)*1000; if(d>0){ const cd=vLen(vSub(c,pts[j]))*1000; score+=(cd-d)*(cd-d); cnt++; } }
      if(cnt===0){ best=c; break; }
      if(score<bestScore){ bestScore=score; best=c; }
    }
    pts.push(best);
  }
  let maxErr=0;
  if(valid){
    for(let i=0;i<n;i++){
      const j=(i+1)%n; const expected=side(i)*1000; const got=vLen(vSub(pts[i],pts[j]))*1000;
      maxErr=Math.max(maxErr,Math.abs(got-expected));
    }
    dkeys.forEach(k=>{
      const [a,b]=k.split('-').map(c=>c.charCodeAt(0)-65);
      const expected=(diagonals[k]||0); const got=vLen(vSub(pts[a],pts[b]))*1000;
      maxErr=Math.max(maxErr,Math.abs(got-expected));
    });
  }
  const angles=pts.map((p,i)=>interiorAngle(pts[(i-1+n)%n],p,pts[(i+1)%n]));
  const area=polygonArea(pts);
  return {pts, angles, area, valid, error, maxErr, sideKeys:keys, diagonalKeys:dkeys};
}
function updateMeasureReadout(res){

  html+='<br>Max residual <b>'+Math.round(res.maxErr)+'</b> mm';
  html+='<br>'+res.angles.map((a,i)=>pointLetter(i)+' '+Math.round(a*180/Math.PI)+'°').join(' · ');
  if(res.maxErr>50) html+='<br><b style="color:#ff6b6b">Measurements inconsistent – please remeasure.</b>';
  el.innerHTML=html;
}

function updateMeasureOffsets(res){

    pos.push(res.pts[0].x,h,res.pts[0].z, res.pts[i].x,h,res.pts[i].z, res.pts[i+1].x,h,res.pts[i+1].z);

function placeMeasureInDesign(){
  const res=reconstructMeasuredPolygon(S.measure);
  if(!res.valid){ showToast('Cannot place invalid measurement'); return; }
  const n=S.measure.n, ms=S.measure;
  while(ms.points.length<n){ const ch=String.fromCharCode(65+ms.points.length); ms.points.push({letter:ch, offsetX:0, offsetY:0, height:2.5, shackle:HARDWARE.shackles[2], turnbuckle:findHardware('turnbuckles','Jaw & Jaw 10mm'), tension:0.05}); }
  ms.points.length=n;
  const startIdx=S.points.length;
  ms.points.forEach(mp=>{
    S.points.push({x:mp.offsetX, y:mp.offsetY, h:mp.height, shackle:findHardware('shackles',mp.shackle.type), turnbuckle:findHardware('turnbuckles',mp.turnbuckle.type)});
  });
  // centre the measured assembly in the garden so it isn't placed relative to the reference corner
  const cx=S.points.slice(startIdx).reduce((a,p)=>a+p.x,0)/n;
  const cy=S.points.slice(startIdx).reduce((a,p)=>a+p.y,0)/n;
  S.points.slice(startIdx).forEach(p=>{ p.x-=cx; p.y-=cy; });
  const avgTension=ms.points.reduce((s,p)=>s+p.tension,0)/n;
  S.sails.push({on:true, shape:'custom', vertices:res.pts.map(p=>({x:p.x,z:p.z})), posts:S.points.map((_,i)=>i).slice(startIdx,startIdx+n), color:ms.colour, material:ms.material, notes:ms.notes, opacity:0.6, dx:0, dz:0, rot:0, tension:avgTension});
  setPanelTab('design');
  buildPointEditors(); buildSailEditors(); updateAll(); touch();
  showToast('Poles and measured sail placed in Design');
}

function handleClick(e){ raycaster.setFromCamera(ndc(e),camera);
  /* poles */
  const poles=raycaster.intersectObjects(polesGroup.children,false);
  if(poles.length){ const idx=poles[0].object.userData.postIdx; if(typeof idx==='number'&&idx>=0) scrollToCard(`#points .card[data-post-idx="${idx}"]`); return; }
  /* furniture (vor Segel, damit Möbel unter dem Segel erreichbar bleiben) */
  const fh=raycaster.intersectObjects(furnGroup.children,true);
  if(fh.length){ let o=fh[0].object; while(o && o.userData.furnKey===undefined) o=o.parent; if(o){ scrollToCard(`#furniture .card[data-fkey="${o.userData.furnKey}"]`); return; } }
  /* person */
  const ph=raycaster.intersectObjects(personGroup.children,false);
  if(ph.length){ scrollToCard('#person .card'); return; }

  const sm=sailMeshes.filter(m=>m.visible); const sh=raycaster.intersectObjects(sm,false);
  if(sh.length){ const si=sailMeshes.indexOf(sh[0].object); scrollToCard(`#sails .card[data-sail-idx="${si}"]`); return; }
  /* walls */
  if(wallsGroup){ const wh=raycaster.intersectObjects(wallsGroup.children,false);
    if(wh.length){ const wk=wh[0].object.userData.wallKey; scrollToCard(wk?`#row-wall-${wk}`:'#group-garden'); return; } }
}
function onPointerDown(e){ if(e.button!==0) return; pointerDownPos={x:e.clientX,y:e.clientY}; raycaster.setFromCamera(ndc(e),camera);
  /* Pfosten zuerst prüfen – mit der Maus verschiebbar (bei „frei platzieren" aus: Snap an Wand) */
  const poles=raycaster.intersectObjects(polesGroup.children,false);
  if(poles.length){ const idx=poles[0].object.userData.postIdx;
    if(typeof idx==='number'&&idx>=0){ const pt=groundPoint(e,0); if(pt){ drag={ type:'post', idx, last:pt }; controls.enabled=false; return; } } }
  /* Möbel & Person zuerst prüfen, damit sie auch UNTER einem Segel greifbar bleiben */
  const fh=raycaster.intersectObjects(furnGroup.children,true);
  if(fh.length){ let o=fh[0].object; while(o && o.userData.furnKey===undefined) o=o.parent;
    if(o && o.userData.furnKey!=='table' && o.userData.furnKey!=='pergola'){
      const pt=groundPoint(e,0); if(pt){ drag={ type:'furn', key:o.userData.furnKey, last:pt }; controls.enabled=false; return; }
    } }
  /* person drag */
  const ph=raycaster.intersectObjects(personGroup.children,false);
  if(ph.length){ const pt=groundPoint(e,0); if(pt){ drag={ type:'person', last:pt }; controls.enabled=false; return; } }
  /* Segel zuletzt – greift überall dort, wo kein Möbel/Person darunter liegt */
  const sm=sailMeshes.filter(m=>m.visible); const sh=raycaster.intersectObjects(sm,false);
  if(sh.length){ drag={ type:'sail', si:sailMeshes.indexOf(sh[0].object), y:sh[0].point.y, last:sh[0].point.clone() }; controls.enabled=false; return; }
}
function onPointerMove(e){ if(!drag) return;
  if(drag.type==='sail'){ const pt=groundPoint(e,drag.y); if(pt){ const s=S.sails[drag.si];
      s.dx=(s.dx||0)+(pt.x-drag.last.x); s.dz=(s.dz||0)+(pt.z-drag.last.z); drag.last.copy(pt);
      const surf=sailSurface(s); s.dx=surf.center.x-surf.G.x; s.dz=surf.center.z-surf.G.z;
      buildSails(); buildRopes(); updateRopeReadouts(); buildLabels(); updateShadow(sunDir.y>0.02); touch(); } }
  else if(drag.type==='person'){ const pt=groundPoint(e,0); if(pt){ const p=S.person; p.x+=(pt.x-drag.last.x); p.y+=(pt.z-drag.last.z); drag.last.copy(pt);
      buildPerson(); buildLabels(); syncPersonInputs(); touch(); } }
  else if(drag.type==='post'){ const pt=groundPoint(e,0); if(pt){ const p=S.points[drag.idx]; const B=refWorld();
      let wx=pt.x, wz=pt.z; const hw=S.garden.w/2, hd=S.garden.d/2;
      wx=Math.max(-hw,Math.min(hw,wx)); wz=Math.max(-hd,Math.min(hd,wz));
      if(!S.optimizer_freePosts){ /* an die nächste Gartenkante kleben */
        const dL=wx+hw, dR=hw-wx, dT=wz+hd, dB=hd-wz, m=Math.min(dL,dR,dT,dB);
        if(m===dL) wx=-hw; else if(m===dR) wx=hw; else if(m===dT) wz=-hd; else wz=hd; }
      p.x=wx-B.x; p.y=wz-B.z; drag.last.copy(pt);
      buildPoles(); buildSails(); buildRopes(); updateRopeReadouts(); buildLabels(); updateShadow(sunDir.y>0.02); syncPointInputs(drag.idx); touch(); } }
  else { const pt=groundPoint(e,0); if(pt){ const f=S.furniture[drag.key]; f.x+=(pt.x-drag.last.x); f.y+=(pt.z-drag.last.z); drag.last.copy(pt);
      buildFurniture(); buildLabels(); updateShadow(sunDir.y>0.02); syncFurnitureInputs(drag.key); touch(); } }
}
function onPointerUp(e){ const wasDrag=!!drag; drag=null; controls.enabled=true;
  const moved = (pointerDownPos && e) ? Math.abs(e.clientX-pointerDownPos.x)+Math.abs(e.clientY-pointerDownPos.y) : 99;
  if(moved<6) handleClick(e);      /* fast unbewegt → als Klick behandeln (Karte auswählen), auch nach Greifen eines Objekts */
  else if(wasDrag) renderDayShade();
  pointerDownPos=null;
}
renderer.domElement.addEventListener('pointerdown',onPointerDown,true);
window.addEventListener('pointermove',onPointerMove); window.addEventListener('pointerup',onPointerUp);
/* Doppelklick auf ein Segel → zugehörige Karte im Panel hervorheben */
renderer.domElement.addEventListener('dblclick',e=>{ raycaster.setFromCamera(ndc(e),camera);
  const sm=sailMeshes.filter(m=>m.visible); const sh=raycaster.intersectObjects(sm,false);
  if(sh.length){ const si=sailMeshes.indexOf(sh[0].object); scrollToCard(`#sails .card[data-sail-idx="${si}"]`); } });

$('panel').addEventListener('dblclick',e=>{ const el=e.target; if(el.tagName==='INPUT'&&el.type==='range'&&el.dataset.default!==undefined){ el.value=el.dataset.default; el.dispatchEvent(new Event('input',{bubbles:true})); } });

applyTranslations();
initProjects();
refreshUI(); snapshot(); updateHistButtons(); onResize(); animate();
document.querySelectorAll('.group > h2').forEach(h=>h.addEventListener('click',()=>h.parentElement.classList.toggle('collapsed')));
</script>
<div id="toast"></div>
<button id="btnOptimizeFloat" data-i18n="btn-optimize-shading"
  style="position:fixed;top:12px;right:16px;z-index:200;padding:7px 14px;
         background:#2c6fbb;color:#fff;border:none;border-radius:6px;
         cursor:pointer;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,.4)">
  Optimize Shading
</button>
<button id="btnFitSailsFloat" data-i18n="btn-fit-sails"
  style="position:fixed;top:48px;right:16px;z-index:200;padding:7px 14px;
         background:#c9a227;color:#0f2417;border:none;border-radius:6px;
         cursor:pointer;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,.4)">
  Fit Sail to Posts
</button>
</body>
