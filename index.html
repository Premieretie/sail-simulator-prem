<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shade Sail Simulator v6.3 — 3D Garden Shadow Planner</title>
<meta name="description" content="Free browser-based 3D simulator for planning shade sail (Sonnensegel) placement. Visualize sun position, shadow casting, and sail orientation for any location, date, and time. No install required.">
<meta name="keywords" content="shade sail simulator, Sonnensegel Planer, garden shadow planner, 3D sun simulator, shade sail planner, shadow calculator garden, Sonnensegel berechnen, sail orientation tool, garden planning tool, sun position calculator">
<meta name="author" content="Alexander Zabelyshenskiy">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://nomiknomik.github.io/shade-sail-simulator/">
<!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
<meta property="og:title" content="Shade Sail Simulator — 3D Garden Shadow Planner">
<meta property="og:description" content="Plan shade sail placement in your garden with accurate 3D shadow simulation. Free, browser-based, no install needed.">
<meta property="og:image" content="https://nomiknomik.github.io/shade-sail-simulator/screenshots/social-preview.png">
<meta property="og:url" content="https://nomiknomik.github.io/shade-sail-simulator/">
<meta property="og:type" content="website">
<meta property="og:locale" content="en_US">
<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Shade Sail Simulator — 3D Garden Shadow Planner">
<meta name="twitter:description" content="Free 3D tool to plan shade sail placement — sun position, shadow area, sail orientation for any location & time.">
<meta name="twitter:image" content="https://nomiknomik.github.io/shade-sail-simulator/screenshots/social-preview.png">
<style>
  :root{ --bg:#0f2417; --panel:#1a3c2b; --panel-2:#24523d; --line:#4a7c59; --text:#f4f1e6; --muted:#a8c5b5; --sun:#ffb81c; --ref:#d4a017; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
  body{display:flex;flex-direction:column}
  #app{display:flex;flex:1;min-height:0;overflow:hidden}
  #projectTabs{display:flex;align-items:stretch;background:#0c1c12;border-bottom:1px solid var(--line);height:36px;flex:0 0 36px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
  #projectTabs .ptab{display:flex;align-items:center;gap:8px;padding:0 10px 0 14px;background:var(--panel);border-right:1px solid var(--line);color:var(--muted);font-size:12px;cursor:pointer;white-space:nowrap;position:relative;user-select:none;flex:0 0 auto}
  #projectTabs .ptab.active{background:var(--panel-2);color:var(--text);box-shadow:inset 0 -2px 0 var(--sun)}
  #projectTabs .ptab .pname{max-width:140px;overflow:hidden;text-overflow:ellipsis}
  #projectTabs .ptab .pclose{border:none;background:transparent;color:var(--muted);font-size:14px;line-height:1;padding:2px 4px;border-radius:4px;cursor:pointer}
  #projectTabs .ptab .pclose:hover{color:#fff;background:rgba(255,255,255,.12)}
  #projectTabs .ptab input.prename{background:var(--panel-2);border:1px solid var(--sun);color:var(--text);font-size:12px;border-radius:4px;padding:1px 4px;width:120px}
  #projectTabs #ptabAdd{flex:0 0 auto;width:36px;background:transparent;border:none;border-right:1px solid var(--line);color:var(--muted);font-size:18px;cursor:pointer}
  #projectTabs #ptabAdd:hover{color:var(--sun);background:rgba(255,255,255,.06)}
  #panel{width:344px;min-width:344px;height:100%;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding-bottom:50px;transition:width .25s ease,min-width .25s ease,opacity .25s ease,padding .25s ease,border-width .25s ease}
  #app.panel-collapsed #panel{width:0;min-width:0;padding-left:0;padding-right:0;border-right-width:0;opacity:0;overflow:hidden}
  #panel header{padding:16px 18px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:3}
  #btnMinimize{position:absolute;right:10px;top:10px;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:2px 6px;font-size:16px;line-height:1;cursor:pointer}
  #btnMinimize:hover{color:var(--text);border-color:var(--text)}
  #panelOpen{position:absolute;left:14px;top:14px;z-index:20;background:rgba(17,22,28,.85);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;font-size:18px;line-height:1;cursor:pointer;backdrop-filter:blur(4px);display:none;pointer-events:auto}
  #panelOpen:hover{border-color:var(--sun);color:var(--sun)}
  #app.panel-collapsed #panelOpen{display:block}
  #panel header h1{margin:0;font-size:16px;padding-right:28px}
  #panel header h1 a{color:var(--text);text-decoration:none}
  #panel header h1 a:hover{color:var(--sun);text-decoration:underline}
  #panel footer{padding:14px 18px;font-size:11px;color:var(--muted);line-height:1.6}
  #panel footer a{color:var(--ref);text-decoration:none}
  #panel footer a:hover{text-decoration:underline}
  #panel header .ver{font-size:11px;color:var(--muted);margin-top:2px}
  #panel header .langbar{display:flex;gap:4px;margin-top:8px}
  #panel header .langbar button{background:var(--panel-2);border:1px solid var(--line);color:var(--muted);border-radius:5px;padding:3px 9px;font-size:12px;cursor:pointer;font-weight:600}
  #panel header .langbar button.active{background:var(--sun);color:#1a1206;border-color:var(--sun)}
  .panel-tabs{display:flex;gap:6px;margin-top:12px;border-bottom:1px solid var(--line);padding-bottom:8px}
  .panel-tabs button{flex:1;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:6px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}
  .panel-tabs button.active{background:var(--sun);color:#1a1206;border-color:var(--sun);font-weight:600}
  .panel-tabs button svg{vertical-align:middle}
  .panel-tab{display:block}
  .panel-tab.hidden{display:none}
  .group{border-bottom:1px solid var(--line);padding:14px 18px}
  .group h2{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--sun);font-weight:600;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
  .group h2::after{content:'▼';font-size:10px;color:var(--muted)}
  .group.collapsed h2::after{content:'▶'}
  .group.collapsed > :not(h2){display:none}
  .group .hint{font-size:11px;color:var(--muted);margin:0 0 8px;line-height:1.5}
  .row{display:flex;align-items:center;gap:6px;margin:6px 0}
  .row label{flex:0 0 96px;font-size:13px;color:var(--muted)}
  .row input[type=range]{flex:1;accent-color:var(--sun);height:3px;min-width:40px}
  .num{width:58px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:4px 5px;font-size:12px}
  .unit{width:14px;font-size:11px;color:var(--muted)}
  .val{width:60px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
  .row input[type=date]{flex:1;background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:4px 6px;font-size:12px}
  .row select{flex:1;background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:5px 6px;font-size:12px}
  .row input[type=color]{width:36px;height:26px;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--panel-2)}
  .row input[type=time]{background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:4px 6px;font-size:12px}
  .card{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0}
  .card h3{margin:0 0 6px;font-size:11px;color:var(--text);font-weight:600;display:flex;justify-content:space-between;align-items:center}
  .btn{background:var(--sun);color:#1a1206;border:none;border-radius:7px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
  .btn.secondary{background:var(--panel-2);color:var(--text);border:1px solid var(--line)}
  .btn:active{transform:translateY(1px)}
  .minib{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:4px 10px;font-size:13px;cursor:pointer;margin-right:4px}
  .minib:active{transform:translateY(1px)}
  .seg{display:flex;gap:4px;margin:4px 0 8px}
  .seg button{flex:1;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:5px;font-size:11px;cursor:pointer}
  .seg button.active{background:var(--sun);color:#1a1206;border-color:var(--sun);font-weight:600}
  .readout{font-size:12px;color:var(--muted);line-height:1.7}
  .readout b{color:var(--text);font-variant-numeric:tabular-nums}
  .legend{font-size:11px;color:var(--muted);line-height:1.7}
  .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
  #stage{flex:1;position:relative}
  #stage canvas{display:block}
  #hud{position:absolute;left:14px;bottom:14px;background:rgba(17,22,28,.8);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12px;backdrop-filter:blur(4px)}
  #hud .night{color:var(--sun)}
  #topleft{position:absolute;left:14px;top:14px;display:flex;flex-direction:column;gap:8px;max-width:280px;pointer-events:none;transition:top .25s ease}
  #app.panel-collapsed #topleft{top:54px}
  #dayHud{background:rgba(17,22,28,.8);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:11px;backdrop-filter:blur(4px);line-height:1.6}
  #dayHud:empty{display:none}
  #dayHud b{color:var(--text);font-variant-numeric:tabular-nums}
  #dayHud .dh-label{color:var(--sun);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
  #dayHud .dh-rect{color:#f1c40f}
  #histHud{display:flex;gap:6px;pointer-events:auto}
  #histHud button{background:rgba(17,22,28,.8);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 13px;font-size:15px;line-height:1;cursor:pointer;backdrop-filter:blur(4px)}
  #histHud button:hover:not(:disabled){border-color:var(--sun);color:var(--sun)}
  #histHud button:disabled{opacity:.35;cursor:default}
  @keyframes card-flash{ 0%{box-shadow:0 0 0 2px var(--sun)} 100%{box-shadow:none} }
  .card.highlight{ animation:card-flash .9s ease-out forwards }
  .group.highlight{ animation:card-flash .9s ease-out forwards }
  @keyframes row-flash{ 0%{background:rgba(244,169,60,.35);box-shadow:0 0 0 2px var(--sun)} 100%{background:transparent;box-shadow:none} }
  .row.highlight{ animation:row-flash 1.2s ease-out forwards;border-radius:6px }
  #toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(20,30,40,.92);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;z-index:500;pointer-events:none;max-width:440px;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.5);display:none;transition:opacity .3s}
</style>
</head>
<body>
<div id="projectTabs"></div>
<div id="app">
  <aside id="panel">
    <header>
      <button id="btnMinimize" title="Minimize panel">◄</button>
      <h1 id="h-title"><a href="https://github.com/nomiknomik/shade-sail-simulator" target="_blank" rel="noopener">Shade Sail Simulator</a></h1>
      <div class="ver">Version 6.3 · EN · Objects placeable across the garden (boundaries grow with garden size) · Posts draggable with wall-snap · Leaner hints</div>
      <div class="langbar">
        <button id="lang-en" class="active" onclick="setLang('en')">EN</button>
      </div>
      <div class="panel-tabs">
        <button id="tabDesign" class="active" title="Design mode"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 4l3.5 14.5L13 18l5-5z"></path><path d="M2 4l1.5 7.5"></path></svg><span>Design</span></button>
        <button id="tabMeasure" title="Measure mode"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12h20"></path><path d="M2 12v6"></path><path d="M22 12v6"></path><path d="M6 12v-2"></path><path d="M10 12v-3"></path><path d="M14 12v-2"></path><path d="M18 12v-3"></path></svg><span>Measure</span></button>
      </div>
    </header>

    <div id="panelDesign" class="panel-tab">
    <div class="group collapsed">
      <h2 data-i18n="sec-data"></h2>
      <div class="row" style="gap:6px">
        <button class="btn secondary" id="btnExport" style="flex:1" data-i18n="btn-export"></button>
        <button class="btn secondary" id="btnImport" style="flex:1" data-i18n="btn-import"></button>
        <button class="btn secondary" id="btnReset" style="flex:0 0 64px" data-i18n="btn-reset"></button>
      </div>
      <p class="hint" id="saveState" data-i18n="hint-save"></p>
      <input id="fileImport" type="file" accept="application/json" hidden>
    </div>

    <div class="group collapsed" id="group-garden">
      <h2 data-i18n="sec-garden"></h2>
      <div class="row"><label data-i18n="lbl-width"></label><input id="gw" type="range" min="3" max="100" step="0.5"><input id="gwn" class="num" type="text" inputmode="decimal"><span class="unit">m</span></div>
      <div class="row"><label data-i18n="lbl-depth"></label><input id="gd" type="range" min="3" max="100" step="0.5"><input id="gdn" class="num" type="text" inputmode="decimal"><span class="unit">m</span></div>
      <div class="row" id="row-wall-x0"><label data-i18n="lbl-wall-x0"></label><input id="wx0" type="range" min="0" max="7" step="0.1"><input id="wx0n" class="num" type="text" inputmode="decimal"><span class="unit">m</span></div>
      <div class="row" id="row-wall-xb"><label data-i18n="lbl-wall-xb"></label><input id="wxb" type="range" min="0" max="7" step="0.1"><input id="wxbn" class="num" type="text" inputmode="decimal"><span class="unit">m</span></div>
      <div class="row" id="row-wall-y0"><label data-i18n="lbl-wall-y0"></label><input id="wy0" type="range" min="0" max="7" step="0.1"><input id="wy0n" class="num" type="text" inputmode="decimal"><span class="unit">m</span></div>
      <div class="row" id="row-wall-yt"><label data-i18n="lbl-wall-yt"></label><input id="wyt" type="range" min="0" max="7" step="0.1"><input id="wytn" class="num" type="text" inputmode="decimal"><span class="unit">m</span></div>
      <div class="row"><label data-i18n="lbl-wall-opacity"></label><input id="wallop" type="range" min="0.1" max="1" step="0.05"><input id="wallopn" class="num" type="text" inputmode="decimal"></div>
      <div class="row"><label data-i18n="lbl-north"></label><input id="north" type="range" min="0" max="360" step="1"><input id="northn" class="num" type="text" inputmode="decimal"><span class="unit">°</span></div>
      <p class="hint" data-i18n="hint-walls"></p>
    </div>

    <div class="group collapsed">
      <h2 data-i18n="sec-location"></h2>
      <div class="row"><label data-i18n="lbl-city"></label>
        <select id="city">
          <option value="">Select a city</option>
          <option value="-33.8688,151.2093">Sydney</option>
          <option value="-37.8136,144.9631">Melbourne</option>
          <option value="-27.4698,153.0251">Brisbane</option>
          <option value="-31.9505,115.8605">Perth</option>
          <option value="-34.9285,138.6007">Adelaide</option>
          <option value="-35.2809,149.1300">Canberra</option>
          <option value="-12.4634,130.8456">Darwin</option>
          <option value="-42.8821,147.3272">Hobart</option>
          <option value="-28.0167,153.4000">Gold Coast</option>
          <option value="-32.9283,151.7817">Newcastle</option>
        </select>
      </div>
      <div class="row"><label data-i18n="lbl-lat"></label><input id="lat" type="text" inputmode="decimal" class="num" style="width:auto;flex:1"></div>
      <div class="row"><label data-i18n="lbl-lon"></label><input id="lon" type="text" inputmode="decimal" class="num" style="width:auto;flex:1"></div>
      <div class="row"><label data-i18n="lbl-date"></label><input id="date" type="date"></div>
      <div class="row"><label data-i18n="lbl-time"></label><input id="time" type="range" min="0" max="1439" step="5"><input id="timeInput" type="time"></div>
      <div class="row" style="gap:8px">
        <button class="btn" id="play" style="flex:1" data-i18n="btn-play"></button>
        <button class="btn secondary" id="now" style="flex:0 0 64px" data-i18n="btn-now"></button>
      </div>
    </div>

    <div class="group collapsed">
      <h2 data-i18n="sec-posts"></h2>
      <p class="hint" data-i18n="hint-posts"></p>
      <div class="row"><label data-i18n="lbl-postlabels"></label><input id="showPostLabels" type="checkbox" style="accent-color:var(--sun)"><span class="unit" style="width:auto;color:var(--muted)" data-i18n="hint-postlabels-3d"></span></div>
      <div class="row"><label data-i18n="lbl-dims"></label><input id="showDims" type="checkbox" style="accent-color:var(--sun)"><span class="unit" style="width:auto;color:var(--muted)" data-i18n="hint-dims-3d"></span></div>
      <div id="points"></div>
    </div>

    <div class="group collapsed">
      <h2 data-i18n="sec-sails"></h2>
      <p class="hint" data-i18n="hint-sails"></p>
      <div id="sails"></div>
      <div style="margin-top:8px">
        <button class="btn" id="btnFitSails" style="width:100%" data-i18n="btn-fit-sails"></button>
      </div>
      <div style="margin-top:6px">
        <button class="btn secondary" id="btnOptimizePosts" style="width:100%" data-i18n="btn-optimize-posts"></button>
      </div>
      <div style="margin-top:6px">
        <button class="btn secondary" id="btnOptimizeSails" style="width:100%" data-i18n="btn-optimize-shading"></button>
      </div>
      <label style="display:flex;align-items:center;gap:6px;margin-top:4px;font-size:0.85em;cursor:pointer">
        <input type="checkbox" id="chkFreePosts"> <span data-i18n="lbl-free-posts"></span>
      </label>
      <div style="display:flex;align-items:center;gap:6px;margin-top:6px;font-size:0.85em">
        <label data-i18n="lbl-opt-model" style="white-space:nowrap"></label>
        <select id="selOptModel" style="flex:1;min-width:0">
          <option value="greedy-v6" data-i18n="opt-model-greedy"></option>
          <option value="kepler" data-i18n="opt-model-kepler"></option>
          <option value="gauss" data-i18n="opt-model-gauss"></option>
          <option value="darwin" data-i18n="opt-model-darwin"></option>
          <option value="boltzmann" data-i18n="opt-model-boltzmann"></option>
        </select>
      </div>
      <div id="optModelDesc" class="readout" style="margin-top:4px;font-size:11px"></div>
      <div style="display:flex;align-items:center;gap:6px;margin-top:4px;font-size:0.85em">
        <label data-i18n="lbl-opt-tol" style="white-space:nowrap"></label>
        <input type="number" id="numOptTol" min="0" max="20" step="0.5" style="width:64px"><span class="unit">m²·h</span>
      </div>
      <p class="hint" data-i18n="hint-optimize-sails"></p>
    </div>

    <div class="group collapsed">
      <h2 data-i18n="sec-furniture"></h2>
      <p class="hint" data-i18n="hint-furniture"></p>
      <div id="furniture"></div>
    </div>

    <div class="group collapsed">
      <h2 data-i18n="sec-person"></h2>
      <p class="hint" data-i18n="hint-person"></p>
      <div id="person"></div>
    </div>

    <div class="group collapsed">
      <h2 data-i18n="sec-shadow"></h2>
      <div class="row"><label data-i18n="lbl-showshadow"></label><input id="showShadow" type="checkbox" checked style="accent-color:var(--sun)"></div>
      <div class="readout" id="shadowReadout"></div>
    </div>
    <div class="group collapsed">
      <h2 data-i18n="sec-dayshade"></h2>
      <p class="hint" data-i18n="hint-dayshade"></p>
      <div class="row"><label data-i18n="lbl-analysis-from"></label><input id="analysisStart" type="time" style="flex:1;background:var(--panel);color:var(--fg);border:1px solid var(--border);border-radius:4px;padding:2px 4px"></div>
      <div class="row"><label data-i18n="lbl-analysis-to"></label><input id="analysisEnd" type="time" style="flex:1;background:var(--panel);color:var(--fg);border:1px solid var(--border);border-radius:4px;padding:2px 4px"></div>
      <div class="readout" id="dayShade"></div>
      <div class="row" style="margin-top:8px">
        <label data-i18n="lbl-eval-on"></label>
        <input id="evalRectOn" type="checkbox" style="accent-color:var(--sun)">
      </div>
      <div id="evalRectInputs">
        <div class="row"><label data-i18n="lbl-eval-cx"></label><input id="evalCx" class="num" type="text" inputmode="decimal" style="width:auto;flex:1"><span class="unit">m</span></div>
        <div class="row"><label data-i18n="lbl-eval-cy"></label><input id="evalCy" class="num" type="text" inputmode="decimal" style="width:auto;flex:1"><span class="unit">m</span></div>
        <div class="row"><label data-i18n="lbl-eval-w"></label><input id="evalW" class="num" type="text" inputmode="decimal" style="width:auto;flex:1"><span class="unit">m</span></div>
        <div class="row"><label data-i18n="lbl-eval-h"></label><input id="evalH" class="num" type="text" inputmode="decimal" style="width:auto;flex:1"><span class="unit">m</span></div>
      </div>
      <p class="hint" data-i18n="rect-hint"></p>
    </div>

function findHardware(kind,type){

function migrate(st){
  if(!st) return null;
  const d=defaultState();
  const hadWalls = st.garden && st.garden.walls && typeof st.garden.walls==='object';
  const legacyWallH = (st.garden && typeof st.garden.wallH==='number') ? st.garden.wallH : null;
  st.garden=Object.assign({},d.garden,st.garden||{});
  if(!hadWalls){
    const wh=(legacyWallH!=null)?legacyWallH:3;
    st.garden.walls={ x0:wh, xb:wh, y0:wh, yt:wh };
  } else {
    st.garden.walls=Object.assign({},d.garden.walls,st.garden.walls);
  }
  delete st.garden.wallH;
  if(typeof st.garden.wallOpacity!=='number'||st.garden.wallOpacity<0.05||st.garden.wallOpacity>1) st.garden.wallOpacity=1;
  st.loc=Object.assign({},d.loc,st.loc||{});
  st.ref={ corner:2, ox:0, oy:0, oz:0 };
  if(!st.dateStr) st.dateStr=d.dateStr;
  if(typeof st.timeMin!=='number') st.timeMin=d.timeMin;
  /* alte showLabels-Flagge auf die beiden neuen Schalter übertragen */
  if(typeof st.showPostLabels!=='boolean') st.showPostLabels=(typeof st.showLabels==='boolean')?st.showLabels:false;
  if(typeof st.showDims!=='boolean') st.showDims=(typeof st.showLabels==='boolean')?st.showLabels:false;
  if(typeof st.uiPanelOpen!=='boolean') st.uiPanelOpen=true;
  if(typeof st.uiPanelTab!=='string') st.uiPanelTab='design';
  if(!st.measure || typeof st.measure!=='object'){
    st.measure={n:6, sides:[4370,4340,7160,3490,2600,7480], diagonals:{'A-C':7750,'A-D':10420,'A-E':8280,'B-D':8300,'B-E':7390,'B-F':8020,'C-E':8080,'C-F':9570,'D-F':5990}, show:true, colour:'#c0392b', material:'', notes:'', datum:'A', points:[]};
  }
  const ms=st.measure;
  if(typeof ms.datum!=='string') ms.datum='A';
  if(typeof ms.material!=='string') ms.material='';
  if(typeof ms.colour!=='string') ms.colour=(typeof ms.color==='string'?ms.color:'#c0392b');
  if(typeof ms.notes!=='string') ms.notes='';
  if(!Array.isArray(ms.points)) ms.points=[];
  while(ms.points.length<ms.n){
    const ch=String.fromCharCode(65+ms.points.length);
    ms.points.push({letter:ch, offsetX:0, offsetY:0, height:2.5, shackle:HARDWARE.shackles[2], turnbuckle:findHardware('turnbuckles','Jaw & Jaw 10mm'), tension:0.05});
  }
  ms.points=ms.points.slice(0,ms.n).map((p,i)=>{ p=p||{}; return {
    letter:typeof p.letter==='string'?p.letter:String.fromCharCode(65+i),
    offsetX:num(p.offsetX,0), offsetY:num(p.offsetY,0), height:num(p.height,2.5),
    shackle:(p&&p.shackle && typeof p.shackle.type==='string') ? findHardware('shackles',p.shackle.type) : HARDWARE.shackles[2],
    turnbuckle:(p&&p.turnbuckle && typeof p.turnbuckle.type==='string') ? findHardware('turnbuckles',p.turnbuckle.type) : findHardware('turnbuckles','Jaw & Jaw 10mm'),
    tension:num(p.tension,0.05)
  }; });
  delete ms.color;
  delete st.showLabels;
  if(!Array.isArray(st.points)||st.points.length===0) st.points=d.points;
  st.points=st.points.map((p,i)=>{
    const def=d.points[i]||{x:0,y:0,h:2.4,shackle:d.points[0].shackle,turnbuckle:d.points[0].turnbuckle};
    return {
      x:num(p&&p.x, def.x),
      y:num(p&&p.y, def.y),
      h:num(p&&p.h, def.h),
      shackle: (p&&p.shackle && typeof p.shackle.type==='string') ? findHardware('shackles', p.shackle.type) : def.shackle,
      turnbuckle: (p&&p.turnbuckle && typeof p.turnbuckle.type==='string') ? findHardware('turnbuckles', p.turnbuckle.type) : def.turnbuckle
    };
  });
  if(!Array.isArray(st.sails)) st.sails=d.sails;
  st.sails=st.sails.map((s,i)=>Object.assign({}, d.sails[i]||d.sails[0], s||{}));
  st.sails.forEach(s=>{
    if(typeof s.rot!=='number'||isNaN(s.rot)) s.rot=0;
    if(typeof s.tension!=='number'||isNaN(s.tension)||s.tension<0) s.tension=0.05;
  });
  st.furniture=Object.assign({},d.furniture,st.furniture||{});
  Object.keys(st.furniture).forEach(k=>{
    const f=st.furniture[k]; if(!f||typeof f!=='object'){ delete st.furniture[k]; return; }
    const type=furnType(k);
    const def=d.furniture[k]||d.furniture[type]||furnDefaults(type);
    st.furniture[k]=Object.assign({},def,f);
    if(type==='pergola') st.furniture[k].sides=Object.assign({},def.sides,st.furniture[k].sides||{});
  });
  if(!st._pivotCorner){
    Object.keys(st.furniture).forEach(k=>{
      const f=st.furniture[k]; const type=furnType(k);
      if(type==='table'){ f.x-=(f.tw||1.1)/2; f.y-=(f.tl||0.7)/2; }
      if(type==='pergola'){ f.x-=(f.pw||3)/2; f.y-=(f.pl||3)/2; }
    });
    st._pivotCorner=true;
  }
  if(!st.person) st.person=d.person; else st.person=Object.assign({},d.person,st.person);
  if(typeof st.person.h!=='number'||st.person.h<0.5) st.person.h=1.9;
  st.evalRect=Object.assign({},d.evalRect,st.evalRect||{});
  if(typeof st.evalRect.on!=='boolean') st.evalRect.on=false;
  ['x0','y0','x1','y1'].forEach(k=>{ if(typeof st.evalRect[k]!=='number'||isNaN(st.evalRect[k])) st.evalRect[k]=0; });
  if(typeof st.analysisStart!=='number'||st.analysisStart<0||st.analysisStart>1380) st.analysisStart=660;
  if(typeof st.analysisEnd!=='number'||st.analysisEnd<60||st.analysisEnd>1440) st.analysisEnd=900;
  if(st.analysisEnd<=st.analysisStart) st.analysisEnd=st.analysisStart+60;
  if(typeof st.optimizer_freePosts!=='boolean') st.optimizer_freePosts=false;
  if(['greedy-v6','kepler','gauss','darwin','boltzmann'].indexOf(st.optimizerModel)<0) st.optimizerModel='greedy-v6';
  if(typeof st.optimizerTolerance!=='number'||isNaN(st.optimizerTolerance)||st.optimizerTolerance<0) st.optimizerTolerance=2.0;
  return st;
}

function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function makeTextSprite(lines,hex){
  const fs=40,lh=48,pad=20; const canvas=document.createElement('canvas'); const ctx=canvas.getContext('2d');
  const font=`600 ${fs}px -apple-system,Segoe UI,Roboto,sans-serif`; ctx.font=font;
  const w=Math.ceil(Math.max(...lines.map(l=>ctx.measureText(l).width)))+pad*2;
  const h=lines.length*lh+pad*2; canvas.width=w; canvas.height=h;
  ctx.font=font; ctx.textBaseline='top';
  ctx.fillStyle='rgba(17,22,28,0.85)'; roundRect(ctx,0,0,w,h,16); ctx.fill();
  ctx.strokeStyle=hex; ctx.lineWidth=4; roundRect(ctx,2,2,w-4,h-4,14); ctx.stroke();
  lines.forEach((l,i)=>{ ctx.fillStyle=i===0?hex:'#d3dde7'; ctx.fillText(l,pad,pad+i*lh); });
  const tex=new THREE.CanvasTexture(canvas); tex.anisotropy=4;

  /* Bildschirm-konstante Größe (unabhängig von der Kamera-Entfernung) – wird je Frame in updateLabelScales() gesetzt */

/* Hält die Label-Größe in Bildschirm-Pixeln konstant: Skala wächst linear mit dem Abstand zur Kamera. */
const LABEL_K=0.000275;
function updateLabelScales(){
  const f=2*Math.tan(camera.fov*DEG/2);

/* Maßlinie wie auf einer technischen Zeichnung: Linie + zwei Pfeilspitzen + Maßzahl */
function addDimLine(group,a,b,text,hex){
  const A=a.clone(),B=b.clone();
  const dir=new THREE.Vector3().subVectors(B,A); const len=dir.length(); if(len<0.08) return;
  dir.normalize();
  const ARROW=0x000000; /* Maßlinien & Pfeile immer schwarz */
  const mat=new THREE.LineBasicMaterial({color:ARROW,depthTest:false,transparent:true});
  const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints([A,B]),mat); line.renderOrder=998; group.add(line);
  const headLen=Math.min(0.28,len*0.3), headW=headLen*0.16;
  const cMat=new THREE.MeshBasicMaterial({color:ARROW,depthTest:false,transparent:true});
  const mkHead=(pos,d)=>{ const c=new THREE.Mesh(new THREE.ConeGeometry(headW,headLen,12),cMat);
    c.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d); c.position.copy(pos); c.renderOrder=998; group.add(c); };
  mkHead(A.clone().addScaledVector(dir, headLen/2), dir.clone().negate()); /* Spitze an A, nach außen */

/* ---- Tagesauswertung ---- */
const ROUND=n=>Math.round(n*100)/100;
/* Sutherland-Hodgman polygon clipping to garden rectangle (XZ plane) */
function clipPolyToGarden(pts){
  const hw=S.garden.w/2, hd=S.garden.d/2;
  const edges=[ // each edge: inside test + intersection
    {inside:p=>p.x>=-hw, intersect:(a,b)=>{const t=(-hw-a.x)/(b.x-a.x); return {x:-hw,z:a.z+t*(b.z-a.z)};}},
    {inside:p=>p.x<= hw, intersect:(a,b)=>{const t=( hw-a.x)/(b.x-a.x); return {x: hw,z:a.z+t*(b.z-a.z)};}},
    {inside:p=>p.z>=-hd, intersect:(a,b)=>{const t=(-hd-a.z)/(b.z-a.z); return {x:a.x+t*(b.x-a.x),z:-hd};}},
    {inside:p=>p.z<= hd, intersect:(a,b)=>{const t=( hd-a.z)/(b.z-a.z); return {x:a.x+t*(b.x-a.x),z: hd};}}
  ];
  let poly=pts.map(p=>({x:p.x,z:p.z}));
  for(const e of edges){
    if(poly.length===0) return [];
    const out=[];
    for(let i=0;i<poly.length;i++){
      const cur=poly[i], prev=poly[(i+poly.length-1)%poly.length];
      const ci=e.inside(cur), pi=e.inside(prev);
      if(pi&&ci) out.push(cur);
      else if(pi&&!ci) out.push(e.intersect(prev,cur));
      else if(!pi&&ci){ out.push(e.intersect(prev,cur)); out.push(cur); }
    }
    poly=out;
  }
  return poly;
}
function polyAreaXZ(pts){
  let a=0; for(let i=0;i<pts.length;i++){const p=pts[i],q=pts[(i+1)%pts.length]; a+=p.x*q.z-q.x*p.z;} return Math.abs(a)/2;
}
function sunDirAtMin(min){
  const {lat,lon}=S.loc; const date=new Date(S.dateStr+'T00:00:00'); date.setMinutes(min);
  const pos=SunCalc.getPosition(date,lat,lon); const az=pos.azimuth,alt=pos.altitude; const nr=S.garden.north*DEG;
  const dir=new THREE.Vector3(-Math.sin(az)*Math.cos(alt),Math.sin(alt),Math.cos(az)*Math.cos(alt)).applyAxisAngle(new THREE.Vector3(0,1,0),nr);
  return { dir, alt };
}
/* Punkt {x,z} eines 3D-Punktes entlang der Sonnenrichtung auf den Boden (y=0) projizieren */
function projToGround(P,dir){ const g=P.clone().addScaledVector(dir,-(P.y/dir.y)); return {x:g.x,z:g.z}; }
function sailGroundPoly(s,dir){ return sailCorners(s).map(P=>projToGround(P,dir)); }
/* Bodenschatten des Pergola-Daches (Rechteck in Dachhöhe) als Polygon */
function pergolaGroundShadow(dir){ const f=S.furniture.pergola; if(!f||!f.on||dir.y<=0.02) return null;
  const B=refWorld(); const pw=f.pw||3,pl=f.pl||3,ph=f.ph||2.2; const yr=(f.yaw||0)*DEG,ca=Math.cos(yr),sa=Math.sin(yr);
  const ox=pw/2,oz=pl/2; /* Dachmittenversatz wie in makePergola() */
  const ccx=B.x+f.x + ox*ca - oz*sa, ccz=B.z+f.y + ox*sa + oz*ca;
  return [[-pw/2,-pl/2],[pw/2,-pl/2],[pw/2,pl/2],[-pw/2,pl/2]].map(([lx,lz])=>{
    const wx=ccx+lx*ca-lz*sa, wz=ccz+lx*sa+lz*ca; return projToGround(new THREE.Vector3(wx,ph,wz),dir); }); }
/* Bodenschatten der vertikalen Pergola-Seitenpanels (je aktives Panel ein Quad) */
function pergolaSideShadows(dir){ const f=S.furniture.pergola; if(!f||!f.on||dir.y<=0.02) return [];
  const sd=f.sides||{}; if(!(sd.front||sd.back||sd.left||sd.right)) return [];
  const B=refWorld(); const pw=f.pw||3,pl=f.pl||3,ph=f.ph||2.2; const yr=(f.yaw||0)*DEG,ca=Math.cos(yr),sa=Math.sin(yr);
  const ox=B.x+f.x, oz=B.z+f.y;
  const W=(lx,lz)=>({x:ox+lx*ca-lz*sa, z:oz+lx*sa+lz*ca}); /* Bodenpunkt (y=0) */
  const polys=[]; const add=(a,b)=>{ const top=p=>projToGround(new THREE.Vector3(p.x,ph,p.z),dir);
    polys.push([ {x:a.x,z:a.z}, {x:b.x,z:b.z}, top(b), top(a) ]); };

  if(sd.back)  add(W(0,pl),W(pw,pl));
  if(sd.left)  add(W(0,0), W(0,pl));
  if(sd.right) add(W(pw,0),W(pw,pl));

/* Bodenschatten der Wände (je Wand ein Quad zwischen Basislinie und projizierter Oberkante) */
function wallGroundShadows(dir){ if(dir.y<=0.02) return []; const {w,d}=S.garden,W=S.garden.walls; const hw=w/2,hd=d/2; const polys=[];
  const add=(b1,b2,h)=>{ if(!(h>0.01)) return; polys.push([ {x:b1[0],z:b1[1]}, {x:b2[0],z:b2[1]},
    projToGround(new THREE.Vector3(b2[0],h,b2[1]),dir), projToGround(new THREE.Vector3(b1[0],h,b1[1]),dir) ]); };
  add([-hw,-hd],[hw,-hd],W.yt); add([-hw,hd],[hw,hd],W.y0); add([-hw,-hd],[-hw,hd],W.xb); add([hw,-hd],[hw,hd],W.x0);
  return polys; }
/* Liefert die Grenzen des Auswertungsrechtecks in Weltkoordinaten (oder null) */
function evalRectWorld(){ const rect=S.evalRect; if(!rect||!rect.on) return null; const B=refWorld();
  return { x0:Math.min(rect.x0,rect.x1)+B.x, x1:Math.max(rect.x0,rect.x1)+B.x,
           z0:Math.min(rect.y0,rect.y1)+B.z, z1:Math.max(rect.y0,rect.y1)+B.z }; }
/* Tagesauswertung per Raster-Sampling des Bodens.
   Eine Zelle zählt für ein Segel nur, wenn sie im Segelschatten liegt UND nicht bereits
   durch Wand/Pergola beschattet ist (Überschneidung wird abgezogen). Innerhalb des Gartens. */
function computeDayShade(){
  const start=S.analysisStart,end=S.analysisEnd,step=15, hours=(end-start)/60;
  const {w,d}=S.garden; const hw=w/2,hd=d/2;
  const NX=Math.max(12,Math.min(70,Math.round(w/0.2))), NY=Math.max(12,Math.min(70,Math.round(d/0.2)));
  const cellA=(w/NX)*(d/NY);
  const activeIdx=S.sails.map((s,i)=>s.on?i:-1).filter(i=>i>=0);
  const sums=S.sails.map(()=>0), sumsRect=S.sails.map(()=>0);
  let unionSum=0, unionSumRect=0;   /* Vereinigung: jede Zelle zaehlt nur EINMAL, egal von wie vielen Segeln beschattet -> keine Doppelzaehlung der Ueberlappung */
  const Rw=evalRectWorld(); const rectOn=!!Rw;
  const cells=[];
  for(let ix=0;ix<NX;ix++){ const cx=-hw+(ix+0.5)*(w/NX);
    for(let iy=0;iy<NY;iy++){ const cz=-hd+(iy+0.5)*(d/NY);
      const inRect=Rw?(cx>=Rw.x0&&cx<=Rw.x1&&cz>=Rw.z0&&cz<=Rw.z1):false;
      cells.push({x:cx,z:cz,inRect}); } }
  for(let m=start;m<=end;m+=step){ const {dir,alt}=sunDirAtMin(m); const wgt=(m===start||m===end)?0.5:1;
    if(!(alt>0&&dir.y>0.02)) continue;
    const blockers=wallGroundShadows(dir); const pg=pergolaGroundShadow(dir); if(pg) blockers.push(pg); blockers.push(...pergolaSideShadows(dir));
    const sailPolys=activeIdx.map(i=>sailGroundPoly(S.sails[i],dir));
    for(const c of cells){
      let blocked=false; for(const bp of blockers){ if(pointInPoly(c,bp)){ blocked=true; break; } }
      if(blocked) continue;
      let anyHit=false;
      activeIdx.forEach((si,k)=>{ if(pointInPoly(c,sailPolys[k])){ sums[si]+=cellA*wgt; if(c.inRect) sumsRect[si]+=cellA*wgt; anyHit=true; } });
      if(anyHit){ unionSum+=cellA*wgt; if(c.inRect) unionSumRect+=cellA*wgt; }
    }
  }
  const fmtMin=m=>`${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`;
  const res={ window:`${fmtMin(start)}–${fmtMin(end)}`, date:S.dateStr, stepMin:step, gridM:ROUND(w/NX), rectOn, perSail:[],
    total_m2h:0, total_avg_m2:0, total_rect_m2h:0, total_rect_avg_m2:0, overlap_m2h:0, overlap_rect_m2h:0 };
  let sumInt=0, sumIntR=0;   /* Summe der Einzel-Segel-Integrale (mit Doppelzaehlung) -> nur fuer die Ueberlappungs-Diagnose */
  S.sails.forEach((s,si)=>{ if(!s.on) return;
    const integral=sums[si]*step/60, avg=integral/hours;
    const integralR=sumsRect[si]*step/60, avgR=integralR/hours;
    res.perSail.push({ sail:si+1, integral_m2h:ROUND(integral), avg_m2:ROUND(avg),
      integral_rect_m2h:ROUND(integralR), avg_rect_m2:ROUND(avgR) });
    sumInt+=integral; sumIntR+=integralR; });
  /* TOTAL = Vereinigung (echter Gesamtschatten OHNE Doppelzaehlung). Ueberlappung = Summe - Vereinigung = verschwendete Doppel-Beschattung. */
  const unionInt=unionSum*step/60, unionIntR=unionSumRect*step/60;
  res.total_m2h=ROUND(unionInt); res.total_avg_m2=ROUND(unionInt/hours);
  res.total_rect_m2h=ROUND(unionIntR); res.total_rect_avg_m2=ROUND(unionIntR/hours);
  res.overlap_m2h=ROUND(Math.max(0,sumInt-unionInt)); res.overlap_rect_m2h=ROUND(Math.max(0,sumIntR-unionIntR));
  return res;
}
function optimizePostAssignment(){
  const activeSails=S.sails.map((s,i)=>({idx:i,shape:s.shape})).filter((_,i)=>S.sails[i].on && S.sails[i].shape!=='custom');
  if(!activeSails.length) return;
  function perms(arr,r){
    if(r===0) return [[]];
    return arr.flatMap((v,i)=>perms([...arr.slice(0,i),...arr.slice(i+1)],r-1).map(p=>[v,...p]));
  }
  function isCollinear(posts){
    if(posts.length<3) return false;
    const a=S.points[posts[0]],b=S.points[posts[1]],c=S.points[posts[2]];
    return Math.abs((b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x))<0.1;
  }
  function fastScore(assignment){
    const orig=activeSails.map(s=>[...S.sails[s.idx].posts]);
    activeSails.forEach((s,i)=>{ S.sails[s.idx].posts=assignment[i]; });
    const start=S.analysisStart,end=S.analysisEnd,step=30;
    const {w,d}=S.garden; const hw=w/2,hd=d/2;
    const NX=20,NY=20; const cellA=(w/NX)*(d/NY);
    const Rw=evalRectWorld(); let score=0;
    for(let m=start;m<=end;m+=step){
      const {dir,alt}=sunDirAtMin(m); if(!(alt>0&&dir.y>0.02)) continue;
      const wgt=(m===start||m===end)?0.5:1;
      const polys=activeSails.map(s=>sailGroundPoly(S.sails[s.idx],dir));
      for(let ix=0;ix<NX;ix++){ const cx=-hw+(ix+0.5)*(w/NX);
        for(let iy=0;iy<NY;iy++){ const cz=-hd+(iy+0.5)*(d/NY);
          if(Rw&&!(cx>=Rw.x0&&cx<=Rw.x1&&cz>=Rw.z0&&cz<=Rw.z1)) continue;
          const pt={x:cx,z:cz};
          for(const poly of polys){ if(pointInPoly(pt,poly)){ score+=cellA*wgt; break; } }
        }
      }
    }
    activeSails.forEach((s,i)=>{ S.sails[s.idx].posts=orig[i]; });
    return score;
  }
  const allPosts=[...Array(S.points.length).keys()];
  let best=-1,bestAssign=null;
  if(activeSails.length===1){
    for(const p of perms(allPosts,activeSails[0].shape)){
      if(activeSails[0].shape===3&&isCollinear(p)) continue;
      const sc=fastScore([p]); if(sc>best){best=sc;bestAssign=[p];}
    }
  } else if(activeSails.length>=2){
    const [s0,s1]=activeSails;
    for(const p0 of perms(allPosts,s0.shape)){
      if(s0.shape===3&&isCollinear(p0)) continue;
      const rem=allPosts.filter(i=>!p0.includes(i));
      for(const p1 of perms(rem,Math.min(s1.shape,rem.length))){
        if(s1.shape===3&&isCollinear(p1)) continue;
        const sc=fastScore([p0,p1]); if(sc>best){best=sc;bestAssign=[p0,p1];}
      }
    }
  }
  if(bestAssign){ activeSails.forEach((s,i)=>{ S.sails[s.idx].posts=bestAssign[i]; }); buildSailEditors(); updateAll(); touch(); }
}

/* ---- Ideale Segel-Positionierung (unabhängig von Pfosten) ---- */
function optimizeSailPositions(){

function _runSailOptimizer(){
  const {w,d}=S.garden; const hw=w/2,hd=d/2;
  const Rw=evalRectWorld(); const useRect=!!(Rw&&S.evalRect.on);
  const B=refWorld();
  const activeSails=S.sails.map((s,i)=>({si:i,s})).filter(({s})=>s.on && s.shape!=='custom');
  if(!activeSails.length) return;

  /* ---- Regressions-Schutz: aktuellen Zustand + echte KPI (Sitzflaeche bevorzugt) als Baseline ---- */
  const kpiNow=()=>{ const r=computeDayShade(); return useRect? r.total_rect_m2h : r.total_m2h; };
  /* ε-Toleranz (Nutzer-Wunsch): Ergebnisse innerhalb ±EPS m²·h gelten als gleich.
     -> verhindert, dass knapp unterlegene (auch synergetische) Kandidaten untergehen, und
        dient als Schwelle fuer den Regressionsschutz. Sekundaerkriterien bei Gleichstand:
        weniger Ueberlappung, dann niedrigere maximale Pfostenhoehe. */
  const EPS=Math.max(0, (typeof S.optimizerTolerance==='number'&&!isNaN(S.optimizerTolerance))? S.optimizerTolerance : 0);
  const MODEL=S.optimizerModel||'greedy-v6';
  const beforeSnap={ points:JSON.parse(JSON.stringify(S.points)),
    sails:S.sails.map(s=>({posts:[...s.posts],dx:s.dx,dz:s.dz,rot:s.rot})) };
  const beforeKPI=kpiNow();

  /* ---- Sonnenrichtungen fuer das EINGEGEBENE Datum (S.dateStr), 30-min-Schritte 10-18 Uhr ---- */
  const sunDirs=[]; let sunSumX=0,sunSumZ=0;
  for(let m=S.analysisStart;m<=S.analysisEnd;m+=30){ const {dir,alt}=sunDirAtMin(m);
    if(alt>0&&dir.y>0.02){ sunDirs.push({dir,wgt:(m===S.analysisStart||m===S.analysisEnd)?0.5:1}); sunSumX+=dir.x; sunSumZ+=dir.z; } }
  if(!sunDirs.length) return;
  /* Mittlere horizontale Sonnenrichtung -> Kipp-Achse (Segel zur Sonne neigen = groesserer Bodenschatten) */
  const tlen=Math.hypot(sunSumX,sunSumZ); const tdx=tlen>1e-6?sunSumX/tlen:0, tdz=tlen>1e-6?sunSumZ/tlen:1;

  /* ---- KPI-konsistente statische Schatten je Zeitschritt: Wand + Pergola ---- */
  const blockersPerStep=sunDirs.map(({dir})=>{ const b=wallGroundShadows(dir); const pg=pergolaGroundShadow(dir); if(pg) b.push(pg); b.push(...pergolaSideShadows(dir)); return b; });

  /* ---- Bewertungszellen: NUR Sitzflaeche (Auswertungsrechteck), sonst ganzer Garten ---- */
  const NX=18,NY=18; const cellA=(w/NX)*(d/NY);
  const cells=[];
  for(let ix=0;ix<NX;ix++){ const cx=-hw+(ix+0.5)*(w/NX);
    for(let iy=0;iy<NY;iy++){ const cz=-hd+(iy+0.5)*(d/NY);
      const inRect=useRect?(cx>=Rw.x0&&cx<=Rw.x1&&cz>=Rw.z0&&cz<=Rw.z1):true;
      if(inRect) cells.push({x:cx,z:cz}); } }
  if(!cells.length){ for(let ix=0;ix<NX;ix++) for(let iy=0;iy<NY;iy++)
    cells.push({x:-hw+(ix+0.5)*(w/NX),z:-hd+(iy+0.5)*(d/NY)}); }

  /* ---- Geometrie ---- */
  const CLEAR=0.15;            /* Segel-Fussabdruck muss mit Abstand in den Garten passen */
  const H_CTR=3.0; const H_MIN=2.0, H_MAX=3.9;
  const tiltArr=[-0.2,-0.1,0,0.1,0.2];   /* Hoehensteigung entlang Sonnen-Achse (gering -> Pfostenhoehen realistisch) */

  /* Kipp-Ebene: Hoehe an Welt-Punkt (wx,wz) relativ zum Segelzentrum (cx,cz) */
  function tiltPlane(wx,wz,cx,cz,slope){ return H_CTR + ((wx-cx)*tdx+(wz-cz)*tdz)*slope; }

  /* Ecken einer Platzierung in Weltkoordinaten (nur XZ-Fussabdruck) */
  function cornersOf(s,cx,cz,rotDeg){ const ang=rotDeg*DEG,ca=Math.cos(ang),sa=Math.sin(ang);
    return sailLocalCorners(s).map(v=>({wx:cx+v.x*ca-v.z*sa, wz:cz+v.x*sa+v.z*ca})); }
  /* Harte Bedingung: ALLE Ecken im Garten minus Abstand -> keine Wand-Kollision (Garten konvex) */
  function fits(corners){ return corners.every(c=> c.wx>=-hw+CLEAR && c.wx<=hw-CLEAR && c.wz>=-hd+CLEAR && c.wz<=hd-CLEAR); }

  /* Bodenschatten einer Platzierung mit Kipp-Ebene */
  function groundPolyWithTilt(s,cx,cz,rotDeg,slope,dir){
    const ang=rotDeg*DEG,ca=Math.cos(ang),sa=Math.sin(ang);
    return sailLocalCorners(s).map(v=>{ const wx=cx+v.x*ca-v.z*sa, wz=cz+v.x*sa+v.z*ca;
      const h=Math.max(H_MIN,Math.min(H_MAX,tiltPlane(wx,wz,cx,cz,slope)));
      return projToGround(new THREE.Vector3(wx,h,wz),dir); }); }

  /* Score = NETTO-Schatten wie die echte KPI: Zelle zaehlt nur, wenn im Segelschatten
     UND nicht bereits durch Wand/Pergola (blockersPerStep) oder ein vorheriges Segel (prev) beschattet. */
  function scoreSailAt(s,cx,cz,rotDeg,slope,prev){
    let sc=0;
    for(let ti=0;ti<sunDirs.length;ti++){
      const {dir,wgt}=sunDirs[ti];
      const poly=groundPolyWithTilt(s,cx,cz,rotDeg,slope,dir);
      const blk=blockersPerStep[ti]; const pv=prev?prev[ti]:null;
      for(const c of cells){
        if(!pointInPoly(c,poly)) continue;
        let bad=false;
        for(const bp of blk){ if(pointInPoly(c,bp)){ bad=true; break; } }
        if(bad) continue;
        if(pv){ for(const pp of pv){ if(pointInPoly(c,pp)){ bad=true; break; } } if(bad) continue; }
        sc+=cellA*wgt; } }
    return sc; }

  /* ---- Kontinuierliche Schranken fuer die globalen Modelle (Gauss/Darwin/Boltzmann) ---- */
  const SLOPE_MIN=-0.25, SLOPE_MAX=0.25;
  const CXMIN=-hw+CLEAR, CXMAX=hw-CLEAR, CZMIN=-hd+CLEAR, CZMAX=hd-CLEAR;
  function clampVar(p){ p.cx=Math.max(CXMIN,Math.min(CXMAX,p.cx)); p.cz=Math.max(CZMIN,Math.min(CZMAX,p.cz));
    p.rot=((p.rot%180)+180)%180; p.slope=Math.max(SLOPE_MIN,Math.min(SLOPE_MAX,p.slope)); return p; }

  /* Machbarkeit eines GANZEN Layouts: alle Segel passen in den Garten UND ueberlappen
     sich nicht im Fussabdruck (sonst kollidieren die Segelkoerper). */
  function placementsFeasible(P){ const fps=[];
    for(let i=0;i<P.length;i++){ const corners=cornersOf(activeSails[i].s,P[i].cx,P[i].cz,P[i].rot);
      if(!fits(corners)) return false;
      const fp=corners.map(c=>({x:c.wx,z:c.wz}));
      for(const pf of fps){ if(polysOverlap(fp,pf)) return false; }
      fps.push(fp); }
    return true; }

  /* SURROGAT-KPI / Synergie-Score: Netto-Beschattung der Sitzflaeche als VEREINIGUNG
     beider Segel (jede Zelle zaehlt nur einmal) abzueglich Wand/Pergola. Das ist die
     gemeinsame Zielfunktion -> synergetische Konstellationen werden NICHT bestraft
     (behebt das sequentielle Greedy-Problem). Schnell genug fuer DE/SA (18x18, 30-min). */
  function jointScore(P){
    if(!placementsFeasible(P)) return -Infinity;
    let sc=0;
    for(let ti=0;ti<sunDirs.length;ti++){ const {dir,wgt}=sunDirs[ti]; const blk=blockersPerStep[ti];
      const polys=P.map((p,i)=>groundPolyWithTilt(activeSails[i].s,p.cx,p.cz,p.rot,p.slope,dir));
      for(const c of cells){
        let bad=false; for(const bp of blk){ if(pointInPoly(c,bp)){ bad=true; break; } } if(bad) continue;
        let hit=false; for(const poly of polys){ if(pointInPoly(c,poly)){ hit=true; break; } }
        if(hit) sc+=cellA*wgt; } }
    return sc; }
  function clonePlacements(P){ return P.map(p=>({cx:p.cx,cz:p.cz,rot:p.rot,slope:p.slope})); }

  /* ---- Grobes Suchraster: ~50-cm-Schritte ueber den Garten, 15-Grad-Rotation ---- */
  const xSt=Math.max(0.5,w/16),zSt=Math.max(0.5,d/16);
  const cxArr=[],czArr=[],rotArr=[];
  for(let x=-hw+CLEAR;x<=hw-CLEAR+1e-3;x+=xSt) cxArr.push(x);
  for(let z=-hd+CLEAR;z<=hd-CLEAR+1e-3;z+=zSt) czArr.push(z);
  for(let r=0;r<180;r+=15) rotArr.push(r);

  /* ---- Phase 1: ein Segel optimal frei platzieren (Greedy mit Netto-Score + Hill-Climb) ---- */
  /* prevFootprints: 2D-Fußabdrücke bereits platzierter Segel (XZ-Ebene).
     Positionen die sich mit diesen überschneiden werden übersprungen. */
  /* Top-K Kandidaten aus dem Grobraster (kein Hill-Climb, kein prev-Ausschluss) */
  function collectTopKGrid(s, K){
    const cands=[];
    for(const cx of cxArr) for(const cz of czArr){
      for(const rot of rotArr){
        const corners=cornersOf(s,cx,cz,rot);
        if(!fits(corners)) continue;
        for(const slope of tiltArr){
          const sc=scoreSailAt(s,cx,cz,rot,slope,null);
          if(cands.length<K || sc>cands[cands.length-1].score){
            cands.push({cx,cz,rot,slope,score:sc});
            cands.sort((a,b)=>b.score-a.score);
            if(cands.length>K) cands.pop();
          }
        }
      }
    }
    return cands;
  }

  function placeOneSail(s,prevSailPolys,prevFootprints){
    let best=-1,bx=0,bz=0,br=0,bt=0,found=false;
    for(const cx of cxArr) for(const cz of czArr){
      for(const rot of rotArr){
        const corners=cornersOf(s,cx,cz,rot);
        if(!fits(corners)) continue;
        // Überlappungsausschluss: Segel-Körper darf vorherige Segel-Körper nicht schneiden
        const fp=corners.map(c=>({x:c.wx,z:c.wz}));
        if(prevFootprints&&prevFootprints.some(pf=>polysOverlap(fp,pf))) continue;
        for(const slope of tiltArr){
          const sc=scoreSailAt(s,cx,cz,rot,slope,prevSailPolys);
          if(sc>best){ best=sc;bx=cx;bz=cz;br=rot;bt=slope;found=true; } } } }
    if(!found) return null;
    let step=Math.max(xSt,zSt)/2;
    for(let iter=0;iter<6;iter++){
      let improved=false;
      const cand=[[bx+step,bz,br],[bx-step,bz,br],[bx,bz+step,br],[bx,bz-step,br],[bx,bz,br+7],[bx,bz,br-7]];
      for(const [cx,cz,rr0] of cand){ const rr=((rr0%180)+180)%180;
        const corners=cornersOf(s,cx,cz,rr);
        if(!fits(corners)) continue;
        const fp=corners.map(c=>({x:c.wx,z:c.wz}));
        if(prevFootprints&&prevFootprints.some(pf=>polysOverlap(fp,pf))) continue;
        for(const slope of tiltArr){ const sc=scoreSailAt(s,cx,cz,rr,slope,prevSailPolys);
          if(sc>best){ best=sc;bx=cx;bz=cz;br=rr;bt=slope;improved=true; } } }
      if(!improved) step/=2;
    }
    return {cx:bx,cz:bz,rot:br,slope:bt,score:best};
  }

  /* Greedy-Durchlauf in gegebener Segel-Reihenfolge -> Platzierungen + Gesamtscore */
  function greedyRun(order){
    const placements=new Array(activeSails.length).fill(null);
    let prevSailPolys=null, prevFootprints=[], total=0, ok=true;
    for(const ai of order){ const {s}=activeSails[ai];
      const pl=placeOneSail(s,prevSailPolys,prevFootprints);
      if(!pl){ ok=false; break; }
      placements[ai]=pl; total+=pl.score;
      const polys=sunDirs.map(({dir})=>groundPolyWithTilt(s,pl.cx,pl.cz,pl.rot,pl.slope,dir));
      if(!prevSailPolys) prevSailPolys=sunDirs.map(()=>[]);
      prevSailPolys=prevSailPolys.map((arr,ti)=>arr.concat([polys[ti]]));
      // Fußabdruck des gerade platzierten Segels für nächste Segel merken
      prevFootprints.push(cornersOf(s,pl.cx,pl.cz,pl.rot).map(c=>({x:c.wx,z:c.wz})));
    }
    return {placements,total,ok};
  }

  /* ============================================================
     MODELL-REGISTRY  (Auswahl per Dropdown -> S.optimizerModel)
     Jedes Modell erzeugt KANDIDATEN-Platzierungen {cx,cz,rot,slope}. ALLE Kandidaten
     werden danach an Pfosten gebunden und auf der ECHTEN KPI (computeDayShade)
     bewertet -> der ε-beste gewinnt. 'greedy-v6' laeuft IMMER als Baseline mit, damit
     kein Modell schlechter als v6.1 werden kann (Regressionsschutz greift zusaetzlich).
     ============================================================ */
  const TOP_K=5;

  /* ---- Modell 'greedy-v6' (Baseline = v6.1): bidirektionaler Greedy + Top-K ---- */
  function genGreedy(){
    const cands=[];
    const greedyOrders = activeSails.length===2 ? [[0,1],[1,0]] : [activeSails.map((_,i)=>i)];
    for(const ord of greedyOrders){ const r=greedyRun(ord); if(r.ok) cands.push(r); }
    if(activeSails.length===2){
      let bestCombo=null, bestComboScore=-1;
      const topK0=collectTopKGrid(activeSails[0].s,TOP_K);
      for(const p0 of topK0){
        const polys0=sunDirs.map(({dir})=>groundPolyWithTilt(activeSails[0].s,p0.cx,p0.cz,p0.rot,p0.slope,dir));
        const fp0=cornersOf(activeSails[0].s,p0.cx,p0.cz,p0.rot).map(c=>({x:c.wx,z:c.wz}));
        const prevPolys0=sunDirs.map((_,ti)=>[polys0[ti]]);
        const pl1=placeOneSail(activeSails[1].s,prevPolys0,[fp0]);
        if(!pl1) continue;
        const combo=p0.score+pl1.score;
        if(combo>bestComboScore){ bestComboScore=combo;
          bestCombo=[{cx:p0.cx,cz:p0.cz,rot:p0.rot,slope:p0.slope},{cx:pl1.cx,cz:pl1.cz,rot:pl1.rot,slope:pl1.slope}]; }
      }
      const topK1=collectTopKGrid(activeSails[1].s,TOP_K);
      for(const p1 of topK1){
        const polys1=sunDirs.map(({dir})=>groundPolyWithTilt(activeSails[1].s,p1.cx,p1.cz,p1.rot,p1.slope,dir));
        const fp1=cornersOf(activeSails[1].s,p1.cx,p1.cz,p1.rot).map(c=>({x:c.wx,z:c.wz}));
        const prevPolys1=sunDirs.map((_,ti)=>[polys1[ti]]);
        const pl0=placeOneSail(activeSails[0].s,prevPolys1,[fp1]);
        if(!pl0) continue;
        const combo=p1.score+pl0.score;
        if(combo>bestComboScore){ bestComboScore=combo;
          bestCombo=[{cx:pl0.cx,cz:pl0.cz,rot:pl0.rot,slope:pl0.slope},{cx:p1.cx,cz:p1.cz,rot:p1.rot,slope:p1.slope}]; }
      }
      if(bestCombo) cands.push({ ok:true, total:bestComboScore, placements:bestCombo });
    }
    return cands;
  }

  /* ---- Modell 'kepler': analytischer Schwerpunkt-Seed (§ Plan 2).
     Projektionsformel: ein Segel auf Hoehe H wirft seinen Mittelpunkt-Schatten auf
     (cx - dir.x*H/dir.y, cz - dir.z*H/dir.y). Aufgeloest nach cx, damit der Schatten
     zur Mittagszeit auf den Sitzflaechen-Schwerpunkt faellt. Bei 2 Segeln wird die
     Sitzflaeche halbiert -> beide Segel decken sich ergaenzend (synergetisch). ---- */
  function genKepler(){
    const midDir=sunDirs[Math.floor(sunDirs.length/2)].dir;
    function centroidOf(filter){ let sx=0,sz=0,n=0;
      for(const c of cells){ if(filter&&!filter(c)) continue; sx+=c.x; sz+=c.z; n++; }
      return n?{x:sx/n,z:sz/n}:{x:0,z:0}; }
    function seedCenter(G){ return { cx:G.x+midDir.x*H_CTR/midDir.y, cz:G.z+midDir.z*H_CTR/midDir.y }; }
    function bestAt(s,c0,prev){
      let cx=c0.cx, cz=c0.cz;
      for(let k=0;k<10;k++){ if(fits(cornersOf(s,cx,cz,0))||fits(cornersOf(s,cx,cz,90))) break; cx*=0.85; cz*=0.85; }
      let best=null;
      for(const rot of rotArr){ if(!fits(cornersOf(s,cx,cz,rot))) continue;
        for(const slope of tiltArr){ const sc=scoreSailAt(s,cx,cz,rot,slope,prev);
          if(!best||sc>best.score) best={cx,cz,rot,slope,score:sc}; } }
      return best;
    }
    let minx=Infinity,maxx=-Infinity,minz=Infinity,maxz=-Infinity;
    for(const c of cells){ if(c.x<minx)minx=c.x; if(c.x>maxx)maxx=c.x; if(c.z<minz)minz=c.z; if(c.z>maxz)maxz=c.z; }
    const cands=[];
    if(activeSails.length===1){
      const pl=bestAt(activeSails[0].s, seedCenter(centroidOf(null)), null);
      if(pl) cands.push({ok:true,placements:[pl]});
    } else if(activeSails.length===2){
      const splitX=(maxx-minx)>=(maxz-minz);
      const midx=(minx+maxx)/2, midz=(minz+maxz)/2;
      const halfA = splitX ? (c=>c.x<=midx) : (c=>c.z<=midz);
      const halfB = splitX ? (c=>c.x> midx) : (c=>c.z> midz);
      for(const [fa,fb] of [[halfA,halfB],[halfB,halfA]]){
        const p0=bestAt(activeSails[0].s, seedCenter(centroidOf(fa)), null);
        if(!p0) continue;
        const prev=sunDirs.map(({dir})=>[groundPolyWithTilt(activeSails[0].s,p0.cx,p0.cz,p0.rot,p0.slope,dir)]);
        const p1=bestAt(activeSails[1].s, seedCenter(centroidOf(fb)), prev);
        if(!p1) continue;
        cands.push({ok:true,placements:[p0,p1]});
      }
    }
    return cands;
  }

  /* ---- Modell 'gauss': gemeinsamer (Block-)Koordinatenabstieg auf jointScore.
     Variiert beide Segel inkl. GEMEINSAMER Verschiebungen -> behebt das sequentielle
     Greedy-Problem (Synergie). Coarse-to-Fine, Start = bester Seed. ---- */
  function gaussRefine(seed){
    let P=clonePlacements(seed).map(clampVar);
    let cur=jointScore(P);
    if(cur===-Infinity) return null;
    for(const [ds,dr,dsl] of [[0.6,12,0.12],[0.3,6,0.06],[0.15,4,0.03],[0.07,2,0.015]]){
      let improved=true, guard=0;
      while(improved && guard++<25){ improved=false;
        for(let i=0;i<P.length;i++){
          const moves=[['cx',ds],['cx',-ds],['cz',ds],['cz',-ds],['rot',dr],['rot',-dr],['slope',dsl],['slope',-dsl]];
          for(const [key,delta] of moves){ const old=P[i][key]; P[i][key]=old+delta; clampVar(P[i]);
            const v=jointScore(P); if(v>cur+1e-6){ cur=v; improved=true; } else { P[i][key]=old; } } }
        if(P.length===2){
          for(const [jx,jz] of [[ds,0],[-ds,0],[0,ds],[0,-ds]]){
            const bak=P.map(p=>({cx:p.cx,cz:p.cz}));
            P.forEach(p=>{ p.cx+=jx; p.cz+=jz; clampVar(p); });
            const v=jointScore(P); if(v>cur+1e-6){ cur=v; improved=true; }
            else P.forEach((p,ii)=>{ p.cx=bak[ii].cx; p.cz=bak[ii].cz; }); }
        }
      }
    }
    return P;
  }

  /* ---- Zufalls-/Vektor-Helfer fuer die globalen Modelle ---- */
  function randIn(a,b){ return a+Math.random()*(b-a); }
  function randPlacement(){ const P=[];
    for(let i=0;i<activeSails.length;i++) P.push({cx:randIn(CXMIN,CXMAX),cz:randIn(CZMIN,CZMAX),rot:randIn(0,180),slope:randIn(SLOPE_MIN,SLOPE_MAX)});
    return P; }
  function flat(P){ const v=[]; for(const p of P) v.push(p.cx,p.cz,p.rot,p.slope); return v; }
  function unflat(v){ const P=[]; for(let i=0;i<activeSails.length;i++){ const o=i*4;
    P.push(clampVar({cx:v[o],cz:v[o+1],rot:v[o+2],slope:v[o+3]})); } return P; }

  /* ---- Modell 'darwin': Differential Evolution auf jointScore (globale Suche). ---- */
  function genDarwin(seeds){
    const D=activeSails.length*4, NP=Math.max(12,Math.min(24,D*4)), GEN=22, F=0.7, CR=0.9;
    const pop=[], fit=[];
    for(const s of seeds){ if(pop.length>=Math.floor(NP/2)) break; pop.push(flat(clonePlacements(s).map(clampVar))); }
    while(pop.length<NP) pop.push(flat(randPlacement()));
    for(const ind of pop) fit.push(jointScore(unflat(ind)));
    for(let g=0;g<GEN;g++){
      for(let i=0;i<NP;i++){
        let a,b,c; do{a=(Math.random()*NP)|0;}while(a===i); do{b=(Math.random()*NP)|0;}while(b===i||b===a); do{c=(Math.random()*NP)|0;}while(c===i||c===a||c===b);
        const trial=pop[i].slice(), R=(Math.random()*D)|0;
        for(let j=0;j<D;j++){ if(Math.random()<CR||j===R) trial[j]=pop[a][j]+F*(pop[b][j]-pop[c][j]); }
        const f=jointScore(unflat(trial));
        if(f>=fit[i]){ pop[i]=trial; fit[i]=f; }
      }
    }
    const order=pop.map((_,i)=>i).sort((x,y)=>fit[y]-fit[x]);
    const out=[];
    for(let k=0;k<Math.min(2,order.length);k++){ if(fit[order[k]]>-Infinity) out.push({ok:true,placements:unflat(pop[order[k]])}); }
    return out;
  }

  /* ---- Modell 'boltzmann': Simulated Annealing auf jointScore, mit Neustarts. ---- */
  function genBoltzmann(seed){
    const out=[], spanX=(CXMAX-CXMIN), spanZ=(CZMAX-CZMIN);
    for(let r=0;r<2;r++){
      let cur = r===0 ? clonePlacements(seed).map(clampVar) : randPlacement();
      let curF=jointScore(cur);
      if(curF===-Infinity){ cur=randPlacement(); curF=jointScore(cur); }
      let best=clonePlacements(cur), bestF=curF;
      let T=Math.max(5, Math.abs(curF)*0.15+5);
      const ITERS=260;
      for(let it=0;it<ITERS;it++){
        const scale=0.05+0.45*(1-it/ITERS);
        const cand=clonePlacements(cur), i=(Math.random()*cand.length)|0;
        cand[i].cx+=(Math.random()*2-1)*spanX*0.25*scale;
        cand[i].cz+=(Math.random()*2-1)*spanZ*0.25*scale;
        cand[i].rot+=(Math.random()*2-1)*40*scale;
        cand[i].slope+=(Math.random()*2-1)*0.15*scale;
        clampVar(cand[i]);
        const f=jointScore(cand);
        if(f>=curF || (f>-Infinity && Math.random()<Math.exp((f-curF)/T))){ cur=cand; curF=f;
          if(f>bestF){ best=clonePlacements(cand); bestF=f; } }
        T*=0.985;
      }
      if(bestF>-Infinity) out.push({ok:true,placements:best});
    }
    return out;
  }

  /* ---- Dispatch: Greedy IMMER als Baseline, dann modellspezifische Kandidaten ---- */
  let candidates = genGreedy();
  if(MODEL!=='greedy-v6'){
    candidates = candidates.concat(genKepler());
    const seeds = candidates.filter(c=>c.placements&&c.placements.every(p=>p)).map(c=>clonePlacements(c.placements));
    if(!seeds.length) seeds.push(randPlacement());
    let bestSeed=seeds[0], bestSeedF=jointScore(bestSeed);
    for(const s of seeds){ const f=jointScore(s); if(f>bestSeedF){ bestSeedF=f; bestSeed=s; } }
    if(MODEL==='gauss'){ const g=gaussRefine(bestSeed); if(g) candidates.push({ok:true,placements:g}); }
    else if(MODEL==='darwin'){ candidates = candidates.concat(genDarwin(seeds)); }
    else if(MODEL==='boltzmann'){ candidates = candidates.concat(genBoltzmann(bestSeed)); }
    /* 'kepler': bereits oben ergaenzt */
  }

  if(!candidates.length){
    /* Kein Kandidat passt in den Garten -> Originalzustand beibehalten */
    return t('opt-reverted').replace('{a}',fmt(beforeKPI)).replace('{b}',fmt(beforeKPI));
  }

  /* ---- Phase 2 + Feinschliff als Funktion: bindet eine Platzierung an Pfosten,
     poliert auf der ECHTEN KPI und liefert die echte Panel-Zahl zurueck.
     Wird fuer JEDEN Kandidaten ausgefuehrt -> der KPI-beste gewinnt (alt vs. neu). ---- */
  function bindAndPolish(placements){
    const results=activeSails.map((as,i)=>({si:as.si,s:as.s,
      cx:placements[i].cx, cz:placements[i].cz,
      rot:placements[i].rot, slope:placements[i].slope}));

    /* Phase 2: Pfosten an die Waende, Segel schwebt frei (Seile ueberbruecken) */
    for(const res of results){ res.corners=cornersOf(res.s,res.cx,res.cz,res.rot); }
    function toWall(cx,cz,px,pz){ let ux=px-cx,uz=pz-cz; const L=Math.hypot(ux,uz)||1e-6; ux/=L; uz/=L;
      let tBest=Infinity;
      if(ux>1e-6) tBest=Math.min(tBest,(hw-cx)/ux); else if(ux<-1e-6) tBest=Math.min(tBest,(-hw-cx)/ux);
      if(uz>1e-6) tBest=Math.min(tBest,(hd-cz)/uz); else if(uz<-1e-6) tBest=Math.min(tBest,(-hd-cz)/uz);
      if(!isFinite(tBest)) tBest=L;
      return { wx:cx+ux*tBest, wz:cz+uz*tBest }; }
    const rawPosts=[];
    for(const res of results){ res.rawIdx=[];
      for(const c of res.corners){
        const wp=S.optimizer_freePosts
          ? {wx:c.wx,wz:c.wz}
          : toWall(res.cx,res.cz,c.wx,c.wz);
        const h=Math.max(H_MIN,Math.min(H_MAX,tiltPlane(wp.wx,wp.wz,res.cx,res.cz,res.slope)));
        rawPosts.push({wx:wp.wx,wz:wp.wz,h,sail:res.si}); res.rawIdx.push(rawPosts.length-1); } }
    const clusters=[]; const rawToCluster=[];
    for(const rp of rawPosts){ let found=-1;
      for(let ci=0;ci<clusters.length;ci++){ if(clusters[ci].sails.has(rp.sail)) continue;
        const dx=clusters[ci].wx-rp.wx,dz=clusters[ci].wz-rp.wz;
        if(Math.hypot(dx,dz)<0.6){ found=ci; break; } }
      if(found>=0){ const cl=clusters[found];
        cl.wx=(cl.wx*cl.n+rp.wx)/(cl.n+1); cl.wz=(cl.wz*cl.n+rp.wz)/(cl.n+1); cl.h=(cl.h*cl.n+rp.h)/(cl.n+1);
        cl.n++; cl.sails.add(rp.sail); rawToCluster.push(found); }
      else { clusters.push({wx:rp.wx,wz:rp.wz,h:rp.h,n:1,sails:new Set([rp.sail])}); rawToCluster.push(clusters.length-1); } }
    while(clusters.length>6){
      let minD=Infinity,mi=0,mj=1,foundDisjoint=false;
      for(let i=0;i<clusters.length;i++) for(let j=i+1;j<clusters.length;j++){
        const disjoint=![...clusters[i].sails].some(x=>clusters[j].sails.has(x));
        const dx=clusters[i].wx-clusters[j].wx,dz=clusters[i].wz-clusters[j].wz,dd=dx*dx+dz*dz;
        if(disjoint&&!foundDisjoint){ foundDisjoint=true; minD=dd;mi=i;mj=j; }
        else if(disjoint===foundDisjoint && dd<minD){ minD=dd;mi=i;mj=j; } }
      clusters[mi].wx=(clusters[mi].wx+clusters[mj].wx)/2; clusters[mi].wz=(clusters[mi].wz+clusters[mj].wz)/2;
      clusters[mi].h=(clusters[mi].h+clusters[mj].h)/2; clusters[mj].sails.forEach(x=>clusters[mi].sails.add(x));
      rawToCluster.forEach((c,k)=>{ if(c===mj) rawToCluster[k]=mi; else if(c>mj) rawToCluster[k]=c-1; });
      clusters.splice(mj,1); }

    const newPoints=clusters.map(c=>({ x:c.wx-B.x, y:c.wz-B.z, h:Math.round(Math.max(H_MIN,Math.min(H_MAX,c.h))*10)/10 }));
    while(newPoints.length<6){ const last=newPoints[newPoints.length-1]||{x:hw-CLEAR-B.x,y:hd-CLEAR-B.z,h:H_CTR}; newPoints.push({x:last.x,y:last.y,h:last.h}); }
    S.points=newPoints;

    for(const res of results){ const s=S.sails[res.si];
      const idx=res.rawIdx.map(ri=>rawToCluster[ri]); s.posts=idx;
      const pg=idx.map(ci=>({x:clusters[ci].wx,z:clusters[ci].wz}));
      const G={x:pg.reduce((q,p)=>q+p.x,0)/pg.length, z:pg.reduce((q,p)=>q+p.z,0)/pg.length};
      s.dx=res.cx-G.x; s.dz=res.cz-G.z;
      const local=sailLocalCorners(res.s).map(v=>({x:v.x,z:v.z}));
      const base=bestAngle2D(local,pg,G);
      let rotDeg=res.rot-base/DEG; rotDeg=((rotDeg%360)+360)%360; if(rotDeg>180) rotDeg-=360;
      s.rot=rotDeg;
    }

    /* Feinschliff (v5.2): Coarse-to-Fine auf der ECHTEN KPI -> nur dx/dz/rot lokal nachjustiert */
    (function polishKPI(){
      let cur=kpiNow();
      for(let round=0;round<2;round++){
        let roundImproved=false;
        for(let si=0;si<S.sails.length;si++){ const s=S.sails[si]; if(!s.on) continue;
          for(const stp of [0.30,0.15,0.05]){
            let improved=true, guard=0;
            while(improved && guard++<40){ improved=false;
              const cands=[[stp,0],[-stp,0],[0,stp],[0,-stp],[stp,stp],[stp,-stp],[-stp,stp],[-stp,-stp]];
              for(const [ddx,ddz] of cands){ const ox=s.dx,oz=s.dz;
                s.dx=ox+ddx; s.dz=oz+ddz; const v=kpiNow();
                if(v>cur+1e-6){ cur=v; improved=true; roundImproved=true; }
                else { s.dx=ox; s.dz=oz; } } }
            const rdeg = stp < 0.1 ? 1 : stp < 0.2 ? 2 : 5;
            for(const dd of [rdeg,-rdeg]){
              const or=s.rot; s.rot=or+dd; const v=kpiNow();
              if(v>cur+1e-6){ cur=v; roundImproved=true; }
              else s.rot=or;
            }
          }
        }
        if(!roundImproved) break;
      }
    })();
    /* Echte KPI + Sekundaerkriterien (Ueberlappung, max. Pfostenhoehe) zurueckgeben */
    const rr=computeDayShade();
    let maxH=0; for(const as of activeSails){ for(const pi of S.sails[as.si].posts){ if(S.points[pi]&&S.points[pi].h>maxH) maxH=S.points[pi].h; } }
    return { kpi: useRect? rr.total_rect_m2h : rr.total_m2h,
             overlap: useRect? rr.overlap_rect_m2h : rr.overlap_m2h, maxH };
  }

  /* ---- Alle Kandidaten binden+polieren, das nach echter KPI BESTE Ergebnis merken.
     ε-Toleranz: liegt ein Kandidat innerhalb ±EPS m²·h, entscheiden Sekundaerkriterien
     (1. weniger Ueberlappung = weniger Verschwendung, 2. niedrigere max. Pfostenhoehe). ---- */
  function candBetter(a,b){
    if(a.kpi > b.kpi + EPS) return true;
    if(b.kpi > a.kpi + EPS) return false;
    if(Math.abs(a.overlap-b.overlap) > 1e-6) return a.overlap < b.overlap;
    return a.maxH < b.maxH;
  }
  let best=null;
  for(const cand of candidates){
    const r=bindAndPolish(cand.placements);
    const snap={ kpi:r.kpi, overlap:r.overlap, maxH:r.maxH,
      points:JSON.parse(JSON.stringify(S.points)),
      sails:S.sails.map(s=>({posts:[...s.posts],dx:s.dx,dz:s.dz,rot:s.rot})) };
    if(best===null || candBetter(snap,best)) best=snap;
  }
  /* Bestes Ergebnis in den State zurueckschreiben */
  S.points=JSON.parse(JSON.stringify(best.points));
  best.sails.forEach((sv,i)=>{ S.sails[i].posts=[...sv.posts]; S.sails[i].dx=sv.dx; S.sails[i].dz=sv.dz; S.sails[i].rot=sv.rot; });

  /* ---- Regressions-Schutz mit ε: neues Layout nur bei SIGNIFIKANTER Verbesserung
     (after > before + EPS). Innerhalb der Toleranz gilt es als gleich -> Altzustand
     behalten (kein Layout-Wechsel ohne echten Mehrwert). ---- */
  const afterKPI=best.kpi;
  let key='opt-improved';
  if(!(afterKPI > beforeKPI + EPS)){
    S.points=beforeSnap.points;
    beforeSnap.sails.forEach((sv,i)=>{ S.sails[i].posts=sv.posts; S.sails[i].dx=sv.dx; S.sails[i].dz=sv.dz; S.sails[i].rot=sv.rot; });
    key='opt-reverted';
  }
  buildPointEditors(); buildSailEditors(); updateAll(); touch();
  /* Meldung wird vom Aufrufer NACH applyTranslations() gesetzt */
  return t(key).replace('{a}',fmt(afterKPI)).replace('{b}',fmt(beforeKPI));
}
/* ---- Toast-Benachrichtigung im Hauptfenster ---- */
function showToast(msg,ms=7000){
  const el=document.getElementById('toast'); if(!el) return;
  el.textContent=msg; el.style.display='block'; el.style.opacity='1';
  clearTimeout(showToast._t);
  showToast._t=setTimeout(()=>{ el.style.opacity='0'; setTimeout(()=>{ el.style.display='none'; el.style.opacity='1'; },300); },ms);
}

/* ---- Segel-Fußabdruck-Überlappung (SAT, normalisierte Achsen, ε=2cm) ---- */
/* Wird NUR im Optimierer verwendet – verhindert dass Kandidatenpositionen
   geprüft werden, bei denen sich Segel-Körper überschneiden würden.
   ε=0.02m: Float-Artefakt bei gemeinsamen Polen (Segel die sich berühren)
   werden NICHT als überlappend gewertet. */
function polysOverlap(A,B){
  const EPS=0.02; // 2cm: sails may touch, but not truly cross
  for(const poly of [A,B]){
    for(let i=0;i<poly.length;i++){
      const a=poly[i],b=poly[(i+1)%poly.length];
      const nx=-(b.z-a.z),nz=b.x-a.x;
      const len=Math.hypot(nx,nz); if(len<1e-9) continue;
      const ux=nx/len,uz=nz/len; // normalisiert → Projektion in Metern
      let minA=Infinity,maxA=-Infinity,minB=Infinity,maxB=-Infinity;
      for(const p of A){ const d=p.x*ux+p.z*uz; if(d<minA)minA=d; if(d>maxA)maxA=d; }
      for(const p of B){ const d=p.x*ux+p.z*uz; if(d<minB)minB=d; if(d>maxB)maxB=d; }
      if(maxA<=minB+EPS||maxB<=minA+EPS) return false; // getrennt (inkl. Berührung)
    }
  }
  return true; // echte Überlappung > 2cm
}

function renderDayShade(){
  const r=computeDayShade(); S.shadeAnalysis=r;
  const out=document.getElementById('dayShade'); if(!out) return;
  if(!r.perSail.length){ out.innerHTML=t('dayshade-none'); renderDayHud(r); return; }
  let html=`<span style="color:var(--muted)">${r.date} · 10–18h</span><br>`;
  r.perSail.forEach(p=>{ html+=`${t('shadow-sail')} ${p.sail}: <b>${fmt(p.integral_m2h)} m²·h</b> <span style="color:var(--muted)">(Ø ${fmt(p.avg_m2)} m²)</span><br>`; });

const PROJ_KEY='shade-projects-v1';

function saveProjectState(id,state){ try{ localStorage.setItem(projectStateKey(id),JSON.stringify(state)); }catch(e){} }
function loadProjectState(id){ try{ const v=localStorage.getItem(projectStateKey(id)); if(v) return JSON.parse(v); }catch(e){} return null; }

function initProjects(){
  const loaded=loadProjectsReg();

    projectsReg=loaded; activeProjectId=loaded.activeId||loaded.list[0].id;
    if(!loaded.list.some(p=>p.id===activeProjectId)) activeProjectId=loaded.list[0].id;
    const st=loadProjectState(activeProjectId);
    if(st){ S=migrate(st)||defaultState(); }
    else { saveProjectState(activeProjectId,S); }
  } else {
    const id=newProjectId();
    projectsReg={ list:[{id,name:t('proj-default-name')+' 1'}], activeId:id };

function switchProject(id){
  if(id===activeProjectId) return;
  saveState();

  projectsReg.activeId=id;

}

function closeProjectTab(id,evt){
  if(evt) evt.stopPropagation();
  if(projectsReg.list.length<=1) return;
  if(!confirm(t('proj-close-confirm'))) return;
  const idx=projectsReg.list.findIndex(p=>p.id===id);
  if(idx<0) return;
  projectsReg.list.splice(idx,1);
  try{ localStorage.removeItem(projectStateKey(id)); }catch(e){}
  if(id===activeProjectId){
    const next=projectsReg.list[Math.max(0,idx-1)] || projectsReg.list[0];
    activeProjectId=next.id;
    projectsReg.activeId=next.id;
    const st=loadProjectState(next.id);
    S=migrate(st)||defaultState();
    refreshUI(); snapshot(); updateHistButtons();
  }
  saveProjectsReg();
  renderProjectTabs();
}

/* ---- Undo/Redo (bis 40 Schritte zurück) ---- */
const HIST_MAX=41; /* aktueller Stand + 40 frühere */
let history=[], hidx=-1, suppressHistory=false;
function snapshot(){ if(suppressHistory) return; const j=JSON.stringify(S);
  if(history[hidx]===j) return;
  history=history.slice(0,hidx+1); history.push(j);
  while(history.length>HIST_MAX) history.shift();
  hidx=history.length-1; updateHistButtons(); }
function applyHistory(){ suppressHistory=true; S=migrate(JSON.parse(history[hidx]))||defaultState();
  refreshUI(); saveState(); suppressHistory=false; updateHistButtons(); }
function undo(){ if(hidx>0){ hidx--; applyHistory(); } }
function redo(){ if(hidx<history.length-1){ hidx++; applyHistory(); } }
function updateHistButtons(){ const u=document.getElementById('undoBtn'),r=document.getElementById('redoBtn');
  if(u) u.disabled=hidx<=0; if(r) r.disabled=hidx>=history.length-1; }

document.addEventListener('keydown',e=>{
  if(!e.target.classList||!e.target.classList.contains('num')) return;
  if(e.key!=='ArrowUp'&&e.key!=='ArrowDown') return;
  e.preventDefault();
  const nu=e.target;
  const row=nu.closest('.row');
  const sl=row?row.querySelector('input[type="range"]'):null;
  const step=sl?parseFloat(sl.step)||0.1:0.1;
  const lo=sl?parseFloat(sl.min):-1e9;
  const hi=sl?parseFloat(sl.max):1e9;
  let v=pn(nu.value)+(e.key==='ArrowUp'?step:-step);
  v=Math.min(hi,Math.max(lo,v));
  const dec=Math.max(0,(String(step).split('.')[1]||'').length);
  v=parseFloat(v.toFixed(dec+1));
  nu.value=fmt(v,2).replace(/,?0+$/,'');
  nu.dispatchEvent(new Event('input',{bubbles:true}));
  nu.dispatchEvent(new Event('change',{bubbles:true}));
});

      <div class="row"><label>${t('lbl-shackle')}</label><select class="shackle" style="flex:1">${hardwareOptions('shackles',p.shackle&&p.shackle.type)}</select><span class="hw-readout" style="font-size:11px;color:var(--muted)">${hardwareReadout(p)}</span></div>

    const shack=card.querySelector('.shackle'), turn=card.querySelector('.turnbuckle'), ro=card.querySelector('.hw-readout');
    shack.onchange=e=>{ p.shackle=findHardware('shackles',e.target.value); if(ro) ro.textContent=hardwareReadout(p); updateAll(); touch(); };
    turn.onchange=e=>{ p.turnbuckle=findHardware('turnbuckles',e.target.value); if(ro) ro.textContent=hardwareReadout(p); updateAll(); touch(); };
